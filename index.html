<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>POS Pro - Café Sierra Escondida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Paleta: niebla de sierra, pino y espresso ============ */
:root {
  --bg: #F1F2EE;        /* niebla */
  --surface: #FFFFFF;   /* porcelana */
  --ink: #211B17;       /* espresso */
  --muted: #7B7269;     /* grano tostado */
  --line: #E3E4DD;
  --pino: #2E4A3E;      /* acento principal */
  --pino-ink: #FFFFFF;
  --salvia: #E1E9E2;    /* tinte del acento */
  --ambar: #A8691A; --ambar-bg: #F7EAD2;
  --rojo: #B3382C; --rojo-bg: #F5DCD8;
  --r-s: 10px; --r-m: 14px; --r-l: 22px;
  --fuente: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
[data-tema="oscuro"] {
  --bg: #14110F; --surface: #1D1916; --ink: #F2EDE5; --muted: #9A8F84; --line: #2D2823;
  --pino: #8CBFA0; --pino-ink: #10201A; --salvia: #233229;
  --ambar: #E0A94A; --ambar-bg: #3A2D14; --rojo: #E57F72; --rojo-bg: #3B1E1A;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--fuente); background: var(--bg); color: var(--ink);
  display: grid; grid-template-columns: 84px 1fr; height: 100dvh; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pino); outline-offset: 2px; }
.ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ico.s { width: 18px; height: 18px; }

/* ============ Barra lateral ============ */
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
.marca { width: 46px; height: 46px; border-radius: 16px; background: var(--pino); color: var(--pino-ink); display: grid; place-items: center; margin-bottom: 14px; }
.nav-btn { position: relative; width: 66px; padding: 10px 0 8px; border: none; background: none; border-radius: var(--r-m); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
.nav-btn:hover { background: var(--bg); }
.nav-btn.activo { background: var(--salvia); color: var(--pino); }
.badge { position: absolute; top: 4px; right: 10px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ambar); color: #fff; font-size: 10px; display: none; place-items: center; padding: 0 5px; }
.rail-fin { margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--ink); background: var(--bg); }

/* ============ Contenido ============ */
.contenido { display: flex; flex-direction: column; min-width: 0; height: 100dvh; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 24px 8px; flex-wrap: wrap; }
.topbar h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.topbar .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
.hoy { display: flex; align-items: center; gap: 12px; }
.meta-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 8px 14px; text-align: left; min-width: 190px; }
.meta-btn .fila-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
.meta-btn strong { font-size: 15px; color: var(--ink); }
.barra { height: 5px; background: var(--salvia); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--pino); border-radius: 3px; width: 0; transition: width .5s; }
.chip-sync { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
.chip-sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--pino); }
.chip-sync.pendiente { color: var(--ambar); border-color: var(--ambar); }
.chip-sync.pendiente i { background: var(--ambar); }

.vista { display: none; flex: 1; min-height: 0; }
.vista.activa { display: flex; }
.vista-pagina { padding: 8px 24px 24px; overflow-y: auto; flex-direction: column; gap: 14px; }

/* ============ Vender ============ */
#v-vender { display: none; gap: 20px; padding: 8px 24px 0 24px; }
#v-vender.activa { display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
.catalogo { display: flex; flex-direction: column; min-height: 0; padding-bottom: 20px; }
.busqueda { position: relative; }
.busqueda .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.busqueda input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); font-size: 15px; }
.busqueda kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 11px var(--fuente); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; flex-shrink: 0; scrollbar-width: none; }
.chip { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip.activo { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid-productos { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); grid-auto-rows: 104px; gap: 10px; align-content: start; padding: 2px 4px 4px 2px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color .12s, background .12s; }
.tile:hover { border-color: var(--pino); }
.tile:active { background: var(--salvia); }
.tile .nombre { font-weight: 700; font-size: 14px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile .pie { display: flex; justify-content: space-between; align-items: baseline; }
.tile .precio { font-weight: 800; font-size: 16px; color: var(--pino); }
.tile .cat { font-size: 11px; color: var(--muted); }
.tile .en-pedido { font-size: 11px; font-weight: 700; background: var(--pino); color: var(--pino-ink); border-radius: 10px; padding: 1px 8px; }

/* Comanda: el pedido como ticket de papel */
.comanda { position: relative; background: var(--surface); border-radius: var(--r-l) var(--r-l) 0 0; margin: 0 0 22px; display: flex; flex-direction: column; min-height: 0; padding: 18px 18px 6px; }
.comanda::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
  background: linear-gradient(135deg, var(--surface) 33.33%, transparent 33.33%) 0 0 / 14px 10px, linear-gradient(225deg, var(--surface) 33.33%, transparent 33.33%) 0 0 / 14px 10px; }
.comanda-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.comanda-cab h2 { margin: 0; font-size: 18px; font-weight: 800; }
.seg { display: inline-flex; background: var(--bg); border-radius: 12px; padding: 3px; }
.seg button { border: none; background: none; padding: 6px 12px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
.seg button.activo { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.lista-carrito { flex: 1; overflow-y: auto; min-height: 80px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item .nom { font-weight: 700; font-size: 14px; }
.item .imp { font-weight: 700; font-size: 14px; text-align: right; }
.item .nota-txt { font-size: 12px; color: var(--ambar); font-style: italic; }
.item .ctrl { display: flex; align-items: center; gap: 6px; grid-column: 1 / -1; }
.btn-cant { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 1; display: grid; place-items: center; }
.btn-cant:hover { background: var(--salvia); }
.item .q { min-width: 22px; text-align: center; font-weight: 800; }
.item .pu { font-size: 12px; color: var(--muted); margin-left: 4px; }
.link-btn { border: none; background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; margin-left: auto; }
.link-btn:hover { background: var(--bg); color: var(--ink); }
.link-btn.peligro:hover { color: var(--rojo); background: var(--rojo-bg); }
.vacio { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 8px; line-height: 1.5; }
.comanda-pie { padding: 12px 0 14px; }
.fila-desc { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.fila-desc input { width: 72px; padding: 7px 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg); }
.fila-desc select { padding: 7px 6px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg); }
.fila-t { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 2px 0; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 12px; }
.pagos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn-pago { padding: 13px 6px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.btn-pago:hover:not(:disabled) { border-color: var(--pino); }
.btn-pago:disabled { opacity: .4; cursor: not-allowed; }
.btn-principal { grid-column: 1 / -1; background: var(--pino); color: var(--pino-ink); border-color: var(--pino); flex-direction: row; justify-content: center; font-size: 16px; padding: 16px; gap: 8px; }
.btn-principal:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--pino); }
#fab-pedido { display: none; }

/* ============ Páginas (tickets, corte, reportes) ============ */
.barra-filtros { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.barra-filtros input[type=date] { padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
.btn { padding: 10px 16px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; }
.btn:hover { border-color: var(--pino); }
.btn.relleno { background: var(--pino); color: var(--pino-ink); border-color: var(--pino); }
.btn.peligro { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.panel { background: var(--surface); border-radius: var(--r-l); padding: 18px 20px; }
.panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.fila { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; }
.fila.fuerte { font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border-radius: var(--r-l); padding: 16px 18px; }
.kpi .t { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; }
.kpi .d { font-size: 12px; font-weight: 700; }
.kpi.principal { background: var(--pino); color: var(--pino-ink); }
.kpi.principal .t, .kpi.principal .d { color: inherit; opacity: .85; }
.sube { color: var(--pino); } .baja { color: var(--rojo); } .igual { color: var(--muted); }
.kpi.principal .sube, .kpi.principal .baja { color: inherit; }
.cols-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.campo { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
.campo input { width: 120px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg); text-align: right; }

.lista-t { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-l); overflow: hidden; }
.fila-t2 { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 12px; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: none; border-right: none; border-top: none; width: 100%; font-size: 14px; }
.fila-t2:last-child { border-bottom: none; }
button.fila-t2:hover { background: var(--bg); }
.fila-t2 .hora { color: var(--muted); font-weight: 600; }
.fila-t2 .sub { display: block; font-size: 12px; color: var(--muted); }
.fila-t2 .monto { font-weight: 800; }
.fila-t2.anulado { opacity: .5; } .fila-t2.anulado .monto { text-decoration: line-through; }
.fila-t2.local { border-left: 3px solid var(--ambar); }
.etq { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
.etq.pend { background: var(--ambar-bg); color: var(--ambar); }
.etq.anul { background: var(--rojo-bg); color: var(--rojo); }
.etq.ok { background: var(--salvia); color: var(--pino); }

.cliente-card { background: var(--surface); border-radius: var(--r-l); padding: 16px 20px; }
.cliente-card .cab { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 16px; margin-bottom: 6px; }
.cliente-card .cab span:last-child { color: var(--ambar); }
.fila-credito { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.fila-credito small { color: var(--muted); }

/* ============ Reportes ============ */
.rangos { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.insight { background: var(--salvia); color: var(--ink); border-radius: var(--r-l); padding: 14px 18px; font-size: 14px; line-height: 1.45; }
.insight b { color: var(--pino); }
.graf { width: 100%; height: auto; display: block; }
.graf text { fill: var(--muted); font-size: 10px; font-family: var(--fuente); }
.leyenda { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hbar { margin: 9px 0; font-size: 13px; }
.hbar .et { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 600; }
.hbar .et span:last-child { color: var(--muted); font-weight: 500; }
.hbar .pista { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.hbar .pista i { display: block; height: 100%; background: var(--pino); border-radius: 4px; }
.horas { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.horas div { aspect-ratio: 1 / 1.5; border-radius: 4px; background: var(--pino); }
.horas-et { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; }
.tabs { display: inline-flex; background: var(--bg); border-radius: 12px; padding: 3px; margin-bottom: 10px; }
.tabs button { border: none; background: none; padding: 6px 12px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tabs button.activo { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
table.tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tabla th { text-align: right; font-weight: 600; color: var(--muted); padding: 6px 4px; font-size: 12px; }
table.tabla td { text-align: right; padding: 9px 4px; border-top: 1px solid var(--line); }
table.tabla th:first-child, table.tabla td:first-child { text-align: left; }
table.tabla td:first-child { font-weight: 600; }

/* ============ Modal, toast, overlay ============ */
#modal { display: none; position: fixed; inset: 0; background: rgba(20,17,15,.55); justify-content: center; align-items: center; z-index: 2000; padding: 14px; backdrop-filter: blur(2px); }
.modal-contenido { background: var(--surface); padding: 22px; border-radius: var(--r-l); width: 400px; max-width: 100%; max-height: 92vh; overflow-y: auto; }
.modal-contenido h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
.nota-pequena { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 5px; }
.modal-contenido input[type=number], .modal-contenido input[type=text], .modal-contenido input[type=password] { width: 100%; padding: 13px; font-size: 18px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); }
.total-modal { font-size: 40px; font-weight: 800; text-align: center; letter-spacing: -.02em; margin: 6px 0; }
.rapidos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rapidos button { padding: 9px 13px; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-s); font-weight: 700; font-size: 13px; }
.rapidos button:hover { border-color: var(--pino); }
.cambio { margin-top: 14px; text-align: center; font-size: 22px; font-weight: 800; color: var(--pino); }
.cambio.falta { color: var(--rojo); }
.acciones-modal { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.acciones-modal button { flex: 1; padding: 13px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.acciones-modal .ok { background: var(--pino); color: var(--pino-ink); border-color: var(--pino); }
.acciones-modal .peligro { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.chk { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; font-weight: 600; }
.exito { text-align: center; }
.exito .check { width: 64px; height: 64px; border-radius: 50%; background: var(--salvia); color: var(--pino); display: grid; place-items: center; margin: 0 auto 8px; }
.exito .check .ico { width: 32px; height: 32px; stroke-width: 2.4; }
.aviso-offline { background: var(--ambar-bg); color: var(--ambar); padding: 10px; border-radius: var(--r-s); font-size: 12px; margin-top: 10px; font-weight: 600; }
.sugeridas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sugeridas button { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 600; }
.sugeridas button:hover { border-color: var(--pino); }
#overlay-carga { display: flex; position: fixed; inset: 0; background: var(--bg); justify-content: center; align-items: center; flex-direction: column; gap: 14px; font-size: 16px; font-weight: 700; z-index: 3000; color: var(--muted); }
#overlay-carga .marca { margin: 0; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 4000; display: none; max-width: 90%; }
#toast.error { background: var(--rojo); color: #fff; } #toast.aviso { background: var(--ambar); color: #fff; }

/* ============ Clientes, productos, cotizaciones, editor ============ */
.solo-mov { display: none; }
.rail { overflow-y: auto; }
.lista-cards { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-l); overflow: hidden; }
.fila-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 13px 18px; border: none; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; font-size: 14px; }
.fila-item:last-child { border-bottom: none; }
button.fila-item:hover { background: var(--bg); }
.fila-item.inactivo { opacity: .5; }
.fila-item .sub, .sel-item .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.fila-item .monto { font-weight: 800; text-align: right; }
.fila-cliente { display: flex; gap: 8px; margin-bottom: 10px; }
.cliente-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); font-weight: 700; font-size: 13px; text-align: left; }
.cliente-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-mini { padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); font-weight: 700; font-size: 12px; white-space: nowrap; }

/* ============ Impresión: ticket térmico y cotización ============ */
#ticket-print, #cot-print { display: none; }
@media print {
  @page { margin: 0; }
  body { display: block; height: auto; overflow: visible; background: #fff; }
  body:not(.imprimiendo-cot) > *:not(#ticket-print) { display: none !important; }
  body.imprimiendo-cot > *:not(#cot-print) { display: none !important; }
  body:not(.imprimiendo-cot) #ticket-print { display: block; width: 72mm; padding: 4mm; font-family: monospace; font-size: 12px; color: #000; }
  #ticket-print hr { border: none; border-top: 1px dashed #000; }
  #ticket-print .tp-centro { text-align: center; }
  #ticket-print .tp-fila { display: flex; justify-content: space-between; gap: 6px; }
  body.imprimiendo-cot #cot-print { display: block; padding: 16mm; font-family: system-ui, 'Segoe UI', sans-serif; color: #000; font-size: 13px; }
  #cot-print .cp-cab { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
  #cot-print .cp-marca { font-size: 22px; font-weight: 800; }
  #cot-print .cp-sub { font-size: 14px; letter-spacing: .04em; }
  #cot-print .cp-der { text-align: right; line-height: 1.5; }
  #cot-print table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  #cot-print th { text-align: left; border-bottom: 1px solid #000; padding: 6px 4px; font-size: 12px; }
  #cot-print td { padding: 8px 4px; border-bottom: 1px solid #ccc; vertical-align: top; }
  #cot-print .r { text-align: right; }
  #cot-print .cp-tot { margin: 14px 0 0 auto; width: 55%; }
  #cot-print .cp-tot div { display: flex; justify-content: space-between; padding: 3px 0; }
  #cot-print .cp-tot .gran { font-size: 17px; font-weight: 800; border-top: 2px solid #000; margin-top: 4px; padding-top: 6px; }
  #cot-print .cp-pie { margin-top: 28px; font-size: 11px; color: #444; }
}

// Pon true si quieres exigir la clave de administrador para cambiar precios al vender
const PEDIR_CLAVE_PRECIO = false;
const NOTAS_RAPIDAS = ["Sin azúcar", "Leche de avena", "Deslactosada", "Extra shot", "Poco hielo", "Bien caliente", "Para compartir"];
const TITULOS = {
  vender: ["Vender", "Toca un producto para agregarlo"], tickets: ["Tickets", "Historial de ventas por día"],
  creditos: ["Por cobrar", "Créditos pendientes de cobro"], corte: ["Corte de caja", "Cierre y arqueo del día"],
  reportes: ["Reportes", "Cómo va el negocio"],
  cotizaciones: ["Cotizaciones", "Presupuestos para tus clientes"], clientes: ["Clientes", "Tu cartera y sus compras"],
  productos: ["Productos", "Catálogo, precios y costos"]
};
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

/* ============================ UTILIDADES ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => "$" + (Number(n) || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-MX");
const redondear = n => Math.round((Number(n) || 0) * 100) / 100;
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const hoy = () => iso(new Date());
const partes = s => s.split("-").map(Number);
const sumarDias = (s, n) => { const [y, m, d] = partes(s); return iso(new Date(y, m - 1, d + n)); };
const fechaCorta = s => { const [, m, d] = partes(s); return d + " " + MESES[m - 1].slice(0, 3); };
const fechaLarga = s => { const [y, m, d] = partes(s); return DIAS[new Date(y, m - 1, d).getDay()] + " " + d + " de " + MESES[m - 1]; };
const nuevoUid = () => Math.random().toString(36).slice(2, 9);
const leer = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const icono = (id, cls = "") => `<svg class="ico ${cls}"><use href="#i-${id}"/></svg>`;

let toastTimer;
function toast(msg, tipo = "") { const t = $("toast"); t.textContent = msg; t.className = tipo; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3200); }
function mostrarOverlay(txt) { $("overlay-texto").textContent = txt; $("overlay-carga").style.display = "flex"; }
function ocultarOverlay() { $("overlay-carga").style.display = "none"; }
function enfocar(id, seleccionar) { setTimeout(() => { const f = $(id); if (f) { f.focus(); if (seleccionar) f.select(); } }, 50); }
function abrirModal(html) { $("modal-cuerpo").innerHTML = html; $("modal").style.display = "flex"; }
function cerrarModal() {
  if (resolverClave) { const r = resolverClave; resolverClave = null; r(""); }
  $("modal").style.display = "none";
}

/* ============================ API ============================ */
async function apiGet(params) { const r = await fetch(API_URL + "?" + new URLSearchParams(params)); return r.json(); }
async function apiPost(body) {
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.status !== "success") { const e = new Error(j.message || "Error del servidor"); e.servidor = true; throw e; }
  return j;
}

/* ============================ TEMA ============================ */
function aplicarTema(t) {
  document.documentElement.dataset.tema = t;
  $("btn-tema").innerHTML = icono(t === "oscuro" ? "sun" : "moon", "s");
}
function alternarTema() {
  const t = document.documentElement.dataset.tema === "oscuro" ? "claro" : "oscuro";
  guardar("pos_tema", t); aplicarTema(t);
}

/* ============================ ESTADO ============================ */
let productos = [];
let carrito = leer("pos_carrito", []).map(i => ({ ...i, uid: i.uid || nuevoUid(), nota: i.nota || "", precioBase: i.precioBase ?? i.precio }));
let categoriaActiva = "TODAS";
let tipoOrden = leer("pos_tipo", "Aquí");
let cola = leer("pos_cola", []);
let freq = leer("pos_freq", {});
let ticketsCache = [], creditosCache = [];
let ultimoResumen = null, pagoActual = null, ocupado = false;
let reporteActual = null, rangoActual = "7d", tabProductos = "top";
let clienteActual = leer("pos_cliente", null);      // cliente asignado al pedido
let cotizacionOrigen = leer("pos_cot", null);       // cotización cargada al pedido
let clientesCache = leer("pos_clientes", []), cotizacionesCache = [], productosAdmin = [];
let claveSesion = "", resolverClave = null, filtroCot = "todas";
let selector = null, selLista = [], cotActual = null, editor = null;

/* ============================ NAVEGACIÓN ============================ */
function irA(vista) {
  document.querySelectorAll(".vista").forEach(v => v.classList.toggle("activa", v.id === "v-" + vista));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("activo", b.dataset.vista === vista));
  const mas = document.querySelector('.nav-btn[data-vista="mas"]');
  if (mas) mas.classList.toggle("activo", !["vender", "tickets", "creditos"].includes(vista));
  $("titulo-vista").textContent = TITULOS[vista][0]; $("subtitulo-vista").textContent = TITULOS[vista][1];
  cerrarComandaMovil();
  if (vista === "tickets") cargarTickets();
  if (vista === "creditos") cargarCreditos(true);
  if (vista === "corte") cargarCorte();
  if (vista === "reportes") cargarReporte();
  if (vista === "cotizaciones") cargarCotizaciones(true);
  if (vista === "clientes") cargarClientes(true);
  if (vista === "productos") cargarProductosAdmin(true);
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { cerrarModal(); cerrarComandaMovil(); }
  const escribiendo = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "/" && !escribiendo && $("modal").style.display !== "flex") { e.preventDefault(); irA("vender"); $("input-buscar").focus(); }
  if (e.key === "Enter" && $("modal").style.display === "flex" && pagoActual && $("pago-imprimir")) confirmarCobro();
});

/* ============================ MENÚ ============================ */
async function descargarMenu(forzar = false) {
  const cache = leer("pos_menu", null);
  if (cache && !forzar) { productos = cache; poblarCategorias(); filtrarProductos(); ocultarOverlay(); }
  else mostrarOverlay("Preparando el mostrador…");
  try {
    const data = await apiGet({ action: "menu" });
    if (!Array.isArray(data)) throw new Error(data.message || "Respuesta inválida");
    productos = data; guardar("pos_menu", data);
    poblarCategorias(); filtrarProductos();
    if (forzar) toast("Menú actualizado");
  } catch (e) {
    if (!productos.length) alert("No se pudo cargar el menú. Revisa tu conexión a internet.");
    else toast("Sin conexión: usando el último menú guardado", "aviso");
  } finally { ocultarOverlay(); }
}
function frecuentes() {
  return Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 8)
    .map(id => productos.find(p => String(p.id) === id)).filter(Boolean);
}
function poblarCategorias() {
  const cats = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
  const lista = ["TODAS", ...(frecuentes().length ? ["FRECUENTES"] : []), ...cats];
  if (!lista.includes(categoriaActiva)) categoriaActiva = "TODAS";
  $("chips").innerHTML = lista.map(c =>
    `<button class="chip ${c === categoriaActiva ? "activo" : ""}" data-cat="${esc(c)}">${c === "TODAS" ? "Todo" : c === "FRECUENTES" ? "Frecuentes" : esc(c)}</button>`).join("");
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  categoriaActiva = b.dataset.cat; poblarCategorias(); filtrarProductos();
});
function productosFiltrados() {
  const txt = $("input-buscar").value.toLowerCase().trim();
  const base = categoriaActiva === "FRECUENTES" ? frecuentes() : productos.filter(p => categoriaActiva === "TODAS" || p.categoria === categoriaActiva);
  return base.filter(p => String(p.nombre).toLowerCase().includes(txt));
}
function filtrarProductos() { renderizarProductos(productosFiltrados()); }
function agregarPrimero() { const l = productosFiltrados(); if (l.length) { agregarAlCarrito(l[0].id); $("input-buscar").select(); } }

function renderizarProductos(lista) {
  const grid = $("grid-productos");
  if (!lista.length) { grid.innerHTML = '<p class="vacio" style="grid-column:1/-1">No hay productos que coincidan.</p>'; return; }
  const enPedido = {}; carrito.forEach(i => enPedido[String(i.id)] = (enPedido[String(i.id)] || 0) + i.cantidad);
  grid.innerHTML = lista.map(p => `
    <button class="tile" data-id="${esc(p.id)}">
      <span class="nombre">${esc(p.nombre)}</span>
      <span class="pie"><span class="precio">${fmt(p.precio)}</span>
        ${enPedido[String(p.id)] ? `<span class="en-pedido">${enPedido[String(p.id)]}</span>` : `<span class="cat">${esc(p.categoria || "")}</span>`}</span>
    </button>`).join("");
}
$("grid-productos").addEventListener("click", e => { const t = e.target.closest(".tile"); if (t) agregarAlCarrito(t.dataset.id); });

/* ============================ PEDIDO ============================ */
function agregarAlCarrito(id) {
  const p = productos.find(x => String(x.id) === String(id)); if (!p) return;
  const it = carrito.find(x => String(x.id) === String(id) && !x.nota && x.precio === p.precio);
  if (it) it.cantidad++;
  else carrito.push({ uid: nuevoUid(), id: p.id, nombre: p.nombre, precio: p.precio, precioBase: p.precio, costo: p.costo || 0, cantidad: 1, nota: "" });
  if (navigator.vibrate) navigator.vibrate(8);
  actualizarCarrito();
}
function cambiarCantidad(uid, d) {
  const it = carrito.find(x => x.uid === uid); if (!it) return;
  it.cantidad += d; if (it.cantidad <= 0) carrito = carrito.filter(x => x !== it);
  actualizarCarrito();
}
function quitarLinea(uid) { carrito = carrito.filter(x => x.uid !== uid); actualizarCarrito(); }
function vaciarCarrito() {
  if (!carrito.length && !clienteActual) return;
  if (confirm("¿Vaciar el pedido actual?")) {
    carrito = []; clienteActual = null; cotizacionOrigen = null; $("desc-valor").value = "";
    guardar("pos_cliente", null); guardar("pos_cot", null); actualizarCarrito();
  }
}

function abrirNota(uid) {
  const it = carrito.find(x => x.uid === uid); if (!it) return;
  abrirModal(`
    <h3>Nota para ${esc(it.nombre)}</h3>
    <p class="nota-pequena">${it.cantidad > 1 ? "La nota se aplica a una sola pieza; el resto queda sin nota." : "Indicaciones para la preparación."}</p>
    <input type="text" id="nota-texto" value="${esc(it.nota)}" maxlength="80" autocomplete="off" onkeydown="if(event.key==='Enter'){event.stopPropagation();guardarNota('${it.uid}')}">
    <div class="sugeridas">${NOTAS_RAPIDAS.map(n => `<button onclick="agregarSugerida('${esc(n)}')">${esc(n)}</button>`).join("")}</div>
    <div class="acciones-modal">
      <button onclick="cerrarModal()">Cancelar</button>
      <button class="ok" onclick="guardarNota('${it.uid}')">Guardar nota</button>
    </div>`);
  enfocar("nota-texto");
}
function agregarSugerida(n) { const i = $("nota-texto"); i.value = i.value ? i.value + ", " + n : n; i.focus(); }
function guardarNota(uid) {
  const idx = carrito.findIndex(x => x.uid === uid); if (idx < 0) return;
  const it = carrito[idx], txt = $("nota-texto").value.trim();
  if (it.cantidad > 1 && txt) { it.cantidad--; carrito.splice(idx + 1, 0, { ...it, uid: nuevoUid(), cantidad: 1, nota: txt }); }
  else it.nota = txt;
  cerrarModal(); actualizarCarrito();
}

function calcularTotales() {
  const subtotal = redondear(carrito.reduce((s, i) => s + i.precio * i.cantidad, 0));
  const valor = parseFloat($("desc-valor").value) || 0;
  let desc = $("desc-tipo").value === "%" ? subtotal * Math.min(valor, 100) / 100 : valor;
  desc = redondear(Math.min(Math.max(desc, 0), subtotal));
  return { subtotal, desc, total: redondear(subtotal - desc) };
}

function actualizarCarrito() {
  const t = calcularTotales();
  guardar("pos_carrito", carrito);
  $("lista-carrito").innerHTML = !carrito.length
    ? '<p class="vacio">El pedido está vacío.<br>Toca un producto para empezar.</p>'
    : carrito.map(i => {
      const cambiado = i.precio !== i.precioBase;
      return `
      <div class="item">
        <div><div class="nom">${esc(i.nombre)}</div>${i.nota ? `<div class="nota-txt">${esc(i.nota)}</div>` : ""}</div>
        <div class="imp">${fmt(i.precio * i.cantidad)}</div>
        <div class="ctrl">
          <button class="btn-cant" data-acc="menos" data-uid="${i.uid}" aria-label="Quitar una pieza">−</button>
          <span class="q">${i.cantidad}</span>
          <button class="btn-cant" data-acc="mas" data-uid="${i.uid}" aria-label="Agregar una pieza">+</button>
          <button class="precio-edit ${cambiado ? "cambiado" : ""}" data-acc="precio" data-uid="${i.uid}" aria-label="Cambiar precio">${fmt(i.precio)} c/u${cambiado ? ` <s>${fmt(i.precioBase)}</s>` : ""}</button>
          <button class="link-btn" data-acc="nota" data-uid="${i.uid}">${i.nota ? "Editar nota" : "Nota"}</button>
          <button class="link-btn peligro" data-acc="quitar" data-uid="${i.uid}" style="margin-left:0">Quitar</button>
        </div>
      </div>`;
    }).join("");
  $("subtotal").textContent = fmt(t.subtotal);
  $("fila-desc").style.display = t.desc > 0 ? "flex" : "none";
  $("desc-monto").textContent = "-" + fmt(t.desc);
  $("gran-total").textContent = fmt(t.total);
  $("btn-cliente-txt").textContent = clienteActual ? clienteActual.nombre : "Mostrador";
  $("banner-cot").innerHTML = cotizacionOrigen
    ? `<div class="banner"><span>Desde la cotización ${esc(cotizacionOrigen)}</span><button class="link-btn" onclick="soltarCotizacion()">Quitar</button></div>` : "";
  document.querySelectorAll(".btn-pago").forEach(b => b.disabled = !carrito.length);
  const piezas = carrito.reduce((s, i) => s + i.cantidad, 0);
  $("fab-cant").textContent = piezas ? `Ver pedido (${piezas})` : "Pedido vacío";
  $("fab-total").textContent = fmt(t.total);
  filtrarProductos();
}
$("lista-carrito").addEventListener("click", e => {
  const b = e.target.closest("button[data-acc]"); if (!b) return;
  const uid = b.dataset.uid;
  if (b.dataset.acc === "mas") cambiarCantidad(uid, 1);
  else if (b.dataset.acc === "menos") cambiarCantidad(uid, -1);
  else if (b.dataset.acc === "nota") abrirNota(uid);
  else if (b.dataset.acc === "precio") editarPrecio(uid);
  else quitarLinea(uid);
});
$("seg-tipo").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tipoOrden = b.dataset.tipo; guardar("pos_tipo", tipoOrden); marcarTipo();
});
function marcarTipo() { document.querySelectorAll("#seg-tipo button").forEach(b => b.classList.toggle("activo", b.dataset.tipo === tipoOrden)); }
function abrirComandaMovil() { $("comanda").classList.add("abierta"); }
function cerrarComandaMovil() { $("comanda").classList.remove("abierta"); }

/* ============================ COBRO ============================ */
function iniciarCobro(metodo) {
  if (!carrito.length) return toast("El pedido está vacío", "aviso");
  if (metodo === "Crédito" && !clienteActual) {
    return abrirSelectorCliente({
      motivo: "Elige a quién se le fía este pedido.", permitirMostrador: false,
      alElegir: c => { clienteActual = { id: c.id, nombre: c.nombre, telefono: c.telefono }; guardar("pos_cliente", clienteActual); actualizarCarrito(); iniciarCobro("Crédito"); }
    });
  }
  const t = calcularTotales();
  pagoActual = { metodo, total: t.total };
  let extra = "";
  if (metodo === "Efectivo") {
    const billetes = [20, 50, 100, 200, 500, 1000].filter(b => b >= t.total);
    extra = `
      <label class="lbl" for="pago-recibido">Efectivo recibido</label>
      <input type="number" id="pago-recibido" inputmode="decimal" min="0" step="any" placeholder="${t.total.toFixed(2)}" oninput="actualizarCambio()">
      <div class="rapidos"><button onclick="setRecibido(${t.total})">Exacto</button>${billetes.map(b => `<button onclick="setRecibido(${b})">${fmt0(b)}</button>`).join("")}</div>
      <div class="cambio" id="pago-cambio">Cambio: ${fmt(0)}</div>`;
  }
  abrirModal(`
    <h3>Cobrar con ${esc(metodo.toLowerCase())}</h3>
    <p class="nota-pequena">${esc(tipoOrden === "Llevar" ? "Para llevar" : "Para consumir aquí")}${clienteActual ? ", cliente " + esc(clienteActual.nombre) : ""}</p>
    <div class="total-modal">${fmt(t.total)}</div>
    ${extra}
    <label class="chk"><input type="checkbox" id="pago-imprimir"> Imprimir ticket</label>
    <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="ok" onclick="confirmarCobro()">Confirmar cobro</button></div>`);
  setTimeout(() => { const f = $("pago-recibido"); if (f) f.focus(); }, 50);
}
function setRecibido(v) { $("pago-recibido").value = v; actualizarCambio(); }
function actualizarCambio() {
  const v = parseFloat($("pago-recibido").value);
  const dif = redondear((isNaN(v) ? pagoActual.total : v) - pagoActual.total);
  const el = $("pago-cambio");
  if (dif >= 0) { el.textContent = "Cambio: " + fmt(dif); el.className = "cambio"; }
  else { el.textContent = "Faltan: " + fmt(-dif); el.className = "cambio falta"; }
}
const nuevoFolio = () => "V-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();

async function confirmarCobro() {
  if (ocupado || !pagoActual) return;
  const t = calcularTotales(), metodo = pagoActual.metodo;
  const cliente = clienteActual ? clienteActual.nombre : "";
  let recibido = null, cambio = 0;
  if (metodo === "Efectivo") {
    const v = parseFloat($("pago-recibido").value);
    recibido = isNaN(v) ? t.total : v;
    if (recibido < t.total - 0.001) return toast("El efectivo recibido es menor al total", "error");
    cambio = redondear(recibido - t.total);
  }
  if (metodo === "Crédito" && !cliente) return toast("Elige al cliente para el crédito", "error");
  const imprimir = $("pago-imprimir").checked;
  const veniaDeCot = !!cotizacionOrigen;

  const ticket = {
    action: "venta", folio: nuevoFolio(), metodoPago: metodo, cliente, descuento: t.desc, tipo: tipoOrden, cotizacion: cotizacionOrigen || "",
    items: carrito.map(i => ({ producto: i.nombre, cantidad: i.cantidad, precioUnitario: i.precio, costoUnitario: i.costo, nota: i.nota }))
  };
  const ahora = new Date();
  const resumen = {
    folio: ticket.folio, fechaTxt: ahora.toLocaleDateString("es-MX"),
    horaTxt: ahora.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" }),
    metodo, cliente, tipo: tipoOrden, subtotal: t.subtotal, descuento: t.desc, total: t.total, recibido, cambio,
    items: carrito.map(i => ({ nombre: i.nombre, nota: i.nota, cantidad: i.cantidad, subtotal: redondear(i.precio * i.cantidad) }))
  };
  const idsVendidos = carrito.map(i => [i.id, i.cantidad]);

  ocupado = true; cerrarModal(); mostrarOverlay("Registrando venta…");
  let sincronizado = true;
  try { await apiPost(ticket); }
  catch (e) {
    if (e.servidor) { ocultarOverlay(); ocupado = false; return alert("El servidor rechazó la venta: " + e.message); }
    cola.push(ticket); guardar("pos_cola", cola); sincronizado = false;
  }
  ocupado = false; ocultarOverlay();

  idsVendidos.forEach(([id, c]) => { if (!String(id).startsWith("LIBRE")) freq[id] = (freq[id] || 0) + c; });
  guardar("pos_freq", freq);
  carrito = []; clienteActual = null; cotizacionOrigen = null; guardar("pos_cliente", null); guardar("pos_cot", null);
  $("desc-valor").value = ""; cerrarComandaMovil();
  actualizarCarrito(); poblarCategorias(); actualizarEstadoSync();
  ultimoResumen = resumen; mostrarExito(resumen, sincronizado);
  if (imprimir) imprimirResumen(resumen);
  if (metodo === "Crédito") cargarCreditos();
  if (sincronizado) { cargarHoy(); cargarClientes(); if (veniaDeCot) cargarCotizaciones(); }
}

function mostrarExito(r, sincronizado) {
  abrirModal(`
    <div class="exito">
      <div class="check">${icono("check")}</div>
      <h3>Cobro registrado</h3>
      <div class="total-modal">${fmt(r.total)}</div>
      <p class="nota-pequena">${esc(r.metodo)}, folio ${esc(r.folio)}</p>
      ${r.metodo === "Efectivo" ? `<div class="cambio">Cambio: ${fmt(r.cambio)}</div>` : ""}
      ${!sincronizado ? '<div class="aviso-offline">Sin conexión: la venta quedó guardada en este dispositivo y se enviará sola al volver el internet.</div>' : ""}
      <div class="acciones-modal"><button onclick="imprimirResumen(ultimoResumen)">Imprimir</button><button class="ok" onclick="cerrarModal()">Nueva venta</button></div>
    </div>`);
}

/* ============================ SINCRONIZACIÓN ============================ */
let sincronizando = false;
function actualizarEstadoSync() {
  const b = $("estado-sync");
  b.className = "chip-sync" + (cola.length ? " pendiente" : "");
  b.querySelector("span").textContent = cola.length ? `${cola.length} sin sincronizar` : "Sincronizado";
}
async function procesarCola(manual = false) {
  if (sincronizando) return;
  if (!cola.length) { if (manual) toast("Todo está sincronizado"); return; }
  sincronizando = true;
  while (cola.length) {
    try { await apiPost(cola[0]); cola.shift(); guardar("pos_cola", cola); }
    catch (e) {
      if (e.servidor) { const r = leer("pos_cola_rechazadas", []); r.push({ venta: cola.shift(), error: e.message }); guardar("pos_cola_rechazadas", r); guardar("pos_cola", cola); continue; }
      break;
    }
  }
  sincronizando = false; actualizarEstadoSync();
  if (manual) toast(cola.length ? "Aún sin conexión, se reintentará" : "Ventas sincronizadas", cola.length ? "aviso" : "");
  if (!cola.length) cargarHoy();
}

/* ============================ REPORTES ============================ */
function calcularRango(clave) {
  const h = hoy(), [y, m] = partes(h);
  switch (clave) {
    case "hoy": return [h, h];
    case "ayer": { const a = sumarDias(h, -1); return [a, a]; }
    case "7d": return [sumarDias(h, -6), h];
    case "30d": return [sumarDias(h, -29), h];
    case "mes": return [iso(new Date(y, m - 1, 1)), h];
    case "mesAnt": return [iso(new Date(y, m - 2, 1)), iso(new Date(y, m - 1, 0))];
  }
}

async function cargarReporte() {

    $("contenido-reporte").innerHTML = '<p class="vacio">No se pudo cargar el reporte. Revisa tu conexión y que el script esté actualizado.</p>';

}

function delta(actual, previo) {
  if (!previo) return actual ? '<span class="d igual">Sin periodo previo</span>' : "";
  const p = (actual - previo) / previo * 100;
  if (Math.abs(p) < 0.5) return '<span class="d igual">Igual que el periodo anterior</span>';
  return `<span class="d ${p > 0 ? "sube" : "baja"}">${p > 0 ? "+" : "−"}${Math.abs(p).toFixed(0)}% vs. periodo anterior</span>`;
}

function renderReporte(r) {
  const margen = r.ventas ? r.utilidad / r.ventas * 100 : 0;
  const mejorDia = r.porDia.reduce((a, b) => b.ventas > a.ventas ? b : a, { ventas: 0 });
  const estrella = r.productos[0];
  const maxHora = Math.max(...r.porHora);
  const horaPico = maxHora > 0 ? r.porHora.indexOf(maxHora) : -1;
  const rentable = [...r.productos].sort((a, b) => b.utilidad - a.utilidad)[0];
  const horaTxt = h => (h % 12 || 12) + (h < 12 ? " a. m." : " p. m.");

  const insights = [];
  if (mejorDia.ventas > 0 && r.dias > 1) insights.push(`Tu mejor día fue el <b>${esc(fechaLarga(mejorDia.fecha))}</b> con <b>${fmt0(mejorDia.ventas)}</b>.`);
  if (estrella) insights.push(`El producto estrella es <b>${esc(estrella.nombre)}</b>: ${estrella.unidades} vendidos que dejaron ${fmt0(estrella.ventas)}.`);
  if (horaPico >= 0) insights.push(`Tu hora pico es de <b>${horaTxt(horaPico)}</b> a ${horaTxt((horaPico + 1) % 24)}. Ten todo listo antes.`);
  if (rentable && estrella && rentable.nombre !== estrella.nombre) insights.push(`El que más utilidad deja es <b>${esc(rentable.nombre)}</b> (${fmt0(rentable.utilidad)}), aunque no es el más vendido.`);
  if (r.pendienteTotal > 0) insights.push(`Tienes <b>${fmt0(r.pendienteTotal)}</b> en créditos por cobrar.`);

  $("contenido-reporte").innerHTML = `
    <div class="sub" style="color:var(--muted);font-size:13px">${esc(fechaLarga(r.desde))}${r.desde !== r.hasta ? " al " + esc(fechaLarga(r.hasta)) : ""}</div>
    <div class="kpis">
      <div class="kpi principal"><div class="t">Ventas</div><div class="v">${fmt0(r.ventas)}</div>${delta(r.ventas, r.anterior.ventas)}</div>
      <div class="kpi"><div class="t">Utilidad</div><div class="v">${fmt0(r.utilidad)}</div>${delta(r.utilidad, r.anterior.utilidad)}</div>
      <div class="kpi"><div class="t">Margen</div><div class="v">${margen.toFixed(0)}%</div><span class="d igual">Costo de insumos ${fmt0(r.costos)}</span></div>
      <div class="kpi"><div class="t">Tickets</div><div class="v">${r.numTickets}</div>${delta(r.numTickets, r.anterior.numTickets)}</div>
      <div class="kpi"><div class="t">Ticket promedio</div><div class="v">${fmt(r.ticketPromedio)}</div><span class="d igual">${r.unidades} piezas vendidas</span></div>
    </div>
    ${insights.length ? `<div class="insights">${insights.map(i => `<div class="insight">${i}</div>`).join("")}</div>` : ""}
    <div class="panel"><h3>Ventas por día</h3>${graficaDias(r.porDia)}
      <div class="leyenda"><span><i style="background:var(--salvia)"></i>Ventas</span><span><i style="background:var(--pino)"></i>Utilidad</span></div></div>
    <div class="cols-2">
      <div class="panel"><h3>Horas de más venta</h3>${mapaHoras(r.porHora, maxHora)}</div>
      <div class="panel"><h3>Método de pago</h3>${barras(r.porMetodo, r.ventas)}</div>
      <div class="panel"><h3>Categorías</h3>${barras(r.porCategoria, r.ventas)}</div>
      <div class="panel"><h3>Consumo</h3>${barras(r.porTipo.map(t => ({ ...t, nombre: t.nombre === "Llevar" ? "Para llevar" : t.nombre === "Aquí" ? "Aquí" : t.nombre })), r.ventas)}
        ${r.anulados ? `<p class="nota-pequena" style="margin-top:12px">Tickets anulados en el periodo: ${r.anulados}</p>` : ""}</div>
    </div>
    <div class="panel"><h3>Productos</h3>
      <div class="tabs" id="tabs-prod">
        <button data-t="top" class="${tabProductos === "top" ? "activo" : ""}">Más vendidos</button>
        <button data-t="util" class="${tabProductos === "util" ? "activo" : ""}">Más rentables</button>
        <button data-t="bajo" class="${tabProductos === "bajo" ? "activo" : ""}">Menos vendidos</button>
      </div>
      <div id="tabla-productos"></div>
    </div>`;
  $("tabs-prod").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tabProductos = b.dataset.t; document.querySelectorAll("#tabs-prod button").forEach(x => x.classList.toggle("activo", x === b)); tablaProductos(); });
  tablaProductos();
}

function graficaDias(dias) {
  const W = 640, H = 190, pl = 40, pb = 22, pt = 8, n = dias.length;
  const max = Math.max(...dias.map(d => d.ventas), 1);
  const bw = (W - pl) / n, ancho = Math.max(2, bw * 0.68);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = [0, .5, 1].map(f => `<line x1="${pl}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(max * f) + 3}" text-anchor="end">${fmt0(max * f)}</text>`).join("");
  g += dias.map((d, i) => {
    const x = pl + i * bw + (bw - ancho) / 2;
    return `<g><title>${esc(fechaLarga(d.fecha))}: ${fmt(d.ventas)} (utilidad ${fmt(d.utilidad)}, ${d.tickets} tickets)</title>
      <rect x="${x}" y="${y(d.ventas)}" width="${ancho}" height="${Math.max(0, H - pb - y(d.ventas))}" rx="3" fill="var(--salvia)"/>
      <rect x="${x}" y="${y(Math.max(d.utilidad, 0))}" width="${ancho}" height="${Math.max(0, H - pb - y(Math.max(d.utilidad, 0)))}" rx="3" fill="var(--pino)"/></g>`;
  }).join("");
  const paso = Math.ceil(n / 8);
  g += dias.map((d, i) => i % paso === 0 ? `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${n <= 7 ? esc(DIAS[new Date(...partes(d.fecha).map((v, k) => k === 1 ? v - 1 : v)).getDay()].slice(0, 3)) + " " + partes(d.fecha)[2] : esc(fechaCorta(d.fecha))}</text>` : "").join("");
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por día">${g}</svg>`;
}

function mapaHoras(horas, max) {
  const ini = Math.max(0, horas.findIndex(v => v > 0) - 1), fin = Math.min(23, 23 - [...horas].reverse().findIndex(v => v > 0) + 1);
  if (max <= 0) return '<p class="nota-pequena">Sin ventas en el periodo.</p>';
  const rango = []; for (let h = ini; h <= fin; h++) rango.push(h);
  return `<div class="horas" style="grid-template-columns:repeat(${rango.length},1fr)">${rango.map(h => `<div title="${h}:00, ${fmt(horas[h])}" style="opacity:${(0.1 + 0.9 * horas[h] / max).toFixed(2)}"></div>`).join("")}</div>
    <div class="horas-et" style="grid-template-columns:repeat(${rango.length},1fr)">${rango.map(h => `<span>${h}</span>`).join("")}</div>
    <p class="nota-pequena" style="margin-top:10px">Más oscuro significa más venta en esa hora del día.</p>`;
}

function barras(lista, total) {
  if (!lista.length) return '<p class="nota-pequena">Sin datos en el periodo.</p>';
  return lista.map(i => {
    const p = total ? i.ventas / total * 100 : 0;
    return `<div class="hbar"><div class="et"><span>${esc(i.nombre)}</span><span>${fmt0(i.ventas)}, ${p.toFixed(0)}%</span></div><div class="pista"><i style="width:${p}%"></i></div></div>`;
  }).join("");
}

function tablaProductos() {
  if (!reporteActual) return;
  let l = [...reporteActual.productos];
  if (tabProductos === "util") l.sort((a, b) => b.utilidad - a.utilidad);
  else if (tabProductos === "bajo") l.sort((a, b) => a.unidades - b.unidades);
  else l.sort((a, b) => b.unidades - a.unidades);
  l = l.slice(0, 15);
  $("tabla-productos").innerHTML = l.length ? `<table class="tabla"><thead><tr><th>Producto</th><th>Piezas</th><th>Ventas</th><th>Utilidad</th><th>Margen</th></tr></thead><tbody>
    ${l.map(p => `<tr><td>${esc(p.nombre)}</td><td>${p.unidades}</td><td>${fmt(p.ventas)}</td><td>${fmt(p.utilidad)}</td><td>${p.ventas ? Math.round(p.utilidad / p.ventas * 100) : 0}%</td></tr>`).join("")}</tbody></table>`
    : '<p class="nota-pequena">Sin datos en el periodo.</p>';
}

function exportarCSV() {
  const r = reporteActual; if (!r) return toast("Primero carga un reporte", "aviso");
  const c = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const filas = [
    ["Reporte", NEGOCIO.nombre], ["Desde", r.desde], ["Hasta", r.hasta], [],
    ["Ventas", r.ventas], ["Costos", r.costos], ["Utilidad", r.utilidad], ["Tickets", r.numTickets], ["Ticket promedio", r.ticketPromedio], [],
    ["Fecha", "Ventas", "Utilidad", "Tickets"], ...r.porDia.map(d => [d.fecha, d.ventas, d.utilidad, d.tickets]), [],
    ["Producto", "Piezas", "Ventas", "Utilidad"], ...r.productos.map(p => [p.nombre, p.unidades, p.ventas, p.utilidad]), [],
    ["Categoría", "Piezas", "Ventas", "Utilidad"], ...r.porCategoria.map(p => [p.nombre, p.unidades, p.ventas, p.utilidad])
  ];
  const blob = new Blob(["\ufeff" + filas.map(f => f.map(c).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `reporte_${r.desde}_a_${r.hasta}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ============================ CLAVE DE ADMINISTRADOR ============================ */
function obtenerClave(motivo) {
  if (claveSesion) return Promise.resolve(claveSesion);
  return new Promise(res => {
    abrirModal(`
      <h3>Clave de administrador</h3>
      <p class="nota-pequena">${esc(motivo || "Esta acción requiere la clave.")}</p>
      <input type="password" id="clave-input" autocomplete="off" onkeydown="if(event.key==='Enter'){event.stopPropagation();enviarClave()}">
      <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="ok" onclick="enviarClave()">Continuar</button></div>`);
    resolverClave = res;
    enfocar("clave-input");
  });
}
function enviarClave() {
  const v = $("clave-input").value; if (!v) return;
  claveSesion = v;
  const r = resolverClave; resolverClave = null;
  $("modal").style.display = "none";
  if (r) r(v);
}
// Ejecuta una acción protegida con clave. Devuelve la respuesta o null si se canceló o falló.
async function accionAdmin(cuerpo, motivo) {
  const clave = await obtenerClave(motivo);
  if (!clave) return null;
  mostrarOverlay("Guardando…");
  try { return await apiPost({ ...cuerpo, clave }); }
  catch (e) {
    if (e.servidor && /clave/i.test(e.message)) claveSesion = "";
    toast(e.servidor ? e.message : "Sin conexión, intenta de nuevo", "error");
    return null;
  } finally { ocultarOverlay(); }
}

function vaciarTrasCotizar() {
  carrito = []; clienteActual = null; cotizacionOrigen = null; $("desc-valor").value = "";
  guardar("pos_cliente", null); guardar("pos_cot", null); cerrarModal(); cerrarComandaMovil(); actualizarCarrito();
}
const estadoCot = q => (q.estado === "Pendiente" && q.vigencia && q.vigencia < hoy()) ? "Vencida" : q.estado;

async function cargarCotizaciones(mostrar = false) {
  if (mostrar) $("contenedor-cotizaciones").innerHTML = '<p class="vacio">Cargando…</p>';
  try { const d = await apiGet({ action: "cotizaciones" }); if (!Array.isArray(d)) throw new Error(d.message); cotizacionesCache = d; }
  catch (e) { if (mostrar) $("contenedor-cotizaciones").innerHTML = '<p class="vacio">No se pudieron cargar. Revisa tu conexión y que el script esté actualizado.</p>'; return; }
  renderCotizaciones();
}
function renderCotizaciones() {
  const l = cotizacionesCache.map((q, i) => ({ q, i })).filter(({ q }) => filtroCot === "todas" || estadoCot(q) === filtroCot);
  const etq = e => e === "Convertida" ? '<span class="etq ok">Convertida</span>' : e === "Vencida" ? '<span class="etq anul">Vencida</span>' : '<span class="etq pend">Pendiente</span>';
  $("contenedor-cotizaciones").innerHTML = l.length
    ? `<div class="lista-cards">${l.map(({ q, i }) => `
      <button class="fila-item" data-i="${i}">
        <span><strong>${esc(q.cliente || "Sin cliente")}</strong> ${etq(estadoCot(q))}<span class="sub">${esc(q.folio)}, ${esc(fechaCorta(q.fecha))}, vigente hasta ${esc(fechaCorta(q.vigencia))}</span></span>
        <span class="monto">${fmt(q.total)}</span>
      </button>`).join("")}</div>`
    : '<p class="vacio">No hay cotizaciones en esta lista.</p>';
}
$("contenedor-cotizaciones").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) abrirDetalleCot(+b.dataset.i); });
$("tabs-cot").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtroCot = b.dataset.f; document.querySelectorAll("#tabs-cot button").forEach(x => x.classList.toggle("activo", x === b)); renderCotizaciones();
});

function abrirDetalleCot(i) {
  const q = cotizacionesCache[i]; if (!q) return;
  const sub = redondear(q.items.reduce((s, x) => s + x.precio * x.cantidad, 0)), est = estadoCot(q);
  abrirModal(`
    <h3>Cotización ${esc(q.folio)}</h3>
    <p class="nota-pequena">${esc(q.cliente || "Sin cliente")}, creada el ${esc(fechaCorta(q.fecha))}, vigente hasta ${esc(fechaCorta(q.vigencia))}. Estado: ${esc(est.toLowerCase())}${q.venta ? ", ticket " + esc(q.venta) : ""}</p>
    ${q.items.map(x => `<div class="fila"><span>${x.cantidad} × ${esc(x.nombre)}${x.nota ? `<br><small style="color:var(--ambar);font-style:italic">${esc(x.nota)}</small>` : ""}</span><span>${fmt(x.precio * x.cantidad)}</span></div>`).join("")}
    ${q.descuento > 0 ? `<div class="fila"><span>Descuento</span><span>-${fmt(q.descuento)}</span></div>` : ""}
    <div class="fila fuerte"><span>Total</span><span>${fmt(redondear(sub - (q.descuento || 0)))}</span></div>
    ${q.notas ? `<p class="nota-pequena" style="margin-top:10px">${esc(q.notas)}</p>` : ""}
    <div class="acciones-modal">
      ${est !== "Convertida" ? `<button class="ok" onclick="cargarCotizacionAlPedido(${i})">Convertir en venta</button>` : ""}
      <button onclick="imprimirCotizacion(cotizacionesCache[${i}])">Imprimir</button>
      <button onclick="compartirCotizacion(cotizacionesCache[${i}])">WhatsApp</button>
    </div>
    <div class="acciones-modal" style="margin-top:8px"><button class="peligro" onclick="eliminarCotizacion(${i})">Eliminar</button><button onclick="cerrarModal()">Cerrar</button></div>`);
}
function cargarCotizacionAlPedido(i) {
  const q = cotizacionesCache[i]; if (!q) return;
  if (carrito.length && !confirm("Se reemplazará el pedido actual por la cotización. ¿Continuar?")) return;
  carrito = q.items.map(x => {
    const p = productos.find(y => String(y.id) === String(x.id));
    return { uid: nuevoUid(), id: x.id, nombre: x.nombre, precio: x.precio, precioBase: p ? p.precio : x.precio, costo: x.costo || 0, cantidad: x.cantidad, nota: x.nota || "" };
  });
  $("desc-tipo").value = "$"; $("desc-valor").value = q.descuento || "";
  const c = clientesCache.find(x => x.nombre.toLowerCase() === String(q.cliente || "").toLowerCase());
  clienteActual = c ? { id: c.id, nombre: c.nombre, telefono: c.telefono } : (q.cliente ? { id: "", nombre: q.cliente, telefono: q.telefono || "" } : null);
  cotizacionOrigen = q.folio; guardar("pos_cliente", clienteActual); guardar("pos_cot", cotizacionOrigen);
  cerrarModal(); irA("vender"); actualizarCarrito();
  toast("Cotización cargada. Puedes ajustar precios antes de cobrar.");
}
function soltarCotizacion() { cotizacionOrigen = null; guardar("pos_cot", null); actualizarCarrito(); }
async function eliminarCotizacion(i) {
  const q = cotizacionesCache[i]; if (!q) return;
  if (!confirm("¿Eliminar la cotización " + q.folio + "?")) return;
  cerrarModal(); mostrarOverlay("Eliminando…");
  try { await apiPost({ action: "eliminarCotizacion", folio: q.folio }); toast("Cotización eliminada"); await cargarCotizaciones(); }
  catch (e) { toast(e.servidor ? e.message : "Sin conexión, intenta de nuevo", "error"); }
  finally { ocultarOverlay(); }
}
function textoCotizacion(q) {
  const sub = redondear(q.items.reduce((s, x) => s + x.precio * x.cantidad, 0));
  return [`*Cotización ${q.folio}*`, NEGOCIO.nombre, q.cliente ? "Para: " + q.cliente : "", "",
    ...q.items.map(x => `${x.cantidad} x ${x.nombre}${x.nota ? " (" + x.nota + ")" : ""}  ${fmt(x.precio * x.cantidad)}`),
    q.descuento > 0 ? "Descuento: -" + fmt(q.descuento) : "", `*Total: ${fmt(redondear(sub - (q.descuento || 0)))}*`, "",
    "Vigente hasta el " + fechaLarga(q.vigencia), q.notas || ""].filter((l, i, a) => l !== "" || (a[i - 1] !== "" && i > 0)).join("\n");
}
function compartirCotizacion(q) { if (q) abrirWhatsApp(q.telefono, textoCotizacion(q)); }
function imprimirCotizacion(q) {
  if (!q) return;
  const sub = redondear(q.items.reduce((s, x) => s + x.precio * x.cantidad, 0)), desc = q.descuento || 0;
  $("cot-print").innerHTML = `
    <div class="cp-cab"><div><div class="cp-marca">${esc(NEGOCIO.nombre)}</div><div class="cp-sub">COTIZACIÓN</div></div>
      <div class="cp-der"><strong>${esc(q.folio)}</strong><br>Fecha: ${esc(fechaLarga(q.fecha))}<br>Vigente hasta: ${esc(fechaLarga(q.vigencia))}</div></div>
    <div>Para: <strong>${esc(q.cliente || "Cliente")}</strong>${q.telefono ? " (" + esc(q.telefono) + ")" : ""}</div>
    <table><thead><tr><th>Cant.</th><th>Descripción</th><th class="r">Precio</th><th class="r">Importe</th></tr></thead><tbody>
      ${q.items.map(x => `<tr><td>${x.cantidad}</td><td>${esc(x.nombre)}${x.nota ? `<br><small>${esc(x.nota)}</small>` : ""}</td><td class="r">${fmt(x.precio)}</td><td class="r">${fmt(x.precio * x.cantidad)}</td></tr>`).join("")}
    </tbody></table>
    <div class="cp-tot">${desc > 0 ? `<div><span>Subtotal</span><span>${fmt(sub)}</span></div><div><span>Descuento</span><span>-${fmt(desc)}</span></div>` : ""}
      <div class="gran"><span>Total</span><span>${fmt(redondear(sub - desc))}</span></div></div>
    ${q.notas ? `<p>${esc(q.notas)}</p>` : ""}
    <p class="cp-pie">Precios en pesos mexicanos. Esta cotización no es un comprobante de pago.</p>`;
  document.body.classList.add("imprimiendo-cot");
  window.print();
}
window.addEventListener("afterprint", () => document.body.classList.remove("imprimiendo-cot"));

/* ============================ PRODUCTOS (ADMINISTRACIÓN) ============================ */
async function cargarProductosAdmin(mostrar = false) {
  if (mostrar) $("contenedor-productos").innerHTML = '<p class="vacio">Cargando…</p>';
  try { const d = await apiGet({ action: "productosAdmin" }); if (!Array.isArray(d)) throw new Error(d.message); productosAdmin = d; }
  catch (e) { if (mostrar) $("contenedor-productos").innerHTML = '<p class="vacio">No se pudo cargar. Revisa tu conexión y que el script esté actualizado.</p>'; return; }
  renderProductosAdmin();
}
function renderProductosAdmin() {
  const q = ($("buscar-producto").value || "").toLowerCase().trim();
  const l = productosAdmin.map((p, i) => ({ p, i })).filter(({ p }) => !q || (p.nombre + " " + p.categoria).toLowerCase().includes(q))
    .sort((a, b) => String(a.p.categoria).localeCompare(String(b.p.categoria)) || String(a.p.nombre).localeCompare(String(b.p.nombre)));
  $("contenedor-productos").innerHTML = l.length
    ? `<div class="lista-cards">${l.map(({ p, i }) => `
      <button class="fila-item ${p.activo ? "" : "inactivo"}" data-i="${i}">
        <span><strong>${esc(p.nombre)}</strong>${p.activo ? "" : ' <span class="etq pend">Oculto</span>'}<span class="sub">${esc(p.categoria || "Sin categoría")}</span></span>
        <span class="monto">${fmt(p.precio)}<span class="sub">Costo ${fmt(p.costo)}${p.precio > 0 ? ", margen " + Math.round((p.precio - p.costo) / p.precio * 100) + "%" : ""}</span></span>
      </button>`).join("")}</div>`
    : '<p class="vacio">No hay productos. Toca "Nuevo producto" para agregar el primero.</p>';
}
$("contenedor-productos").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) editarProducto(+b.dataset.i); });

function editarProducto(idx = -1) {
  const p = idx >= 0 ? productosAdmin[idx] : null;
  const cats = [...new Set(productosAdmin.map(x => x.categoria).filter(Boolean))];
  abrirModal(`
    <h3>${p ? "Editar producto" : "Nuevo producto"}</h3>
    <label class="lbl" for="prod-nombre">Nombre</label>
    <input type="text" id="prod-nombre" value="${esc(p ? p.nombre : "")}" autocomplete="off" maxlength="80">
    <label class="lbl" for="prod-cat">Categoría</label>
    <input type="text" id="prod-cat" list="lista-cats" value="${esc(p ? p.categoria : "")}" autocomplete="off">
    <datalist id="lista-cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <div class="dos-col">
      <div><label class="lbl" for="prod-precio">Precio de venta</label><input type="number" id="prod-precio" inputmode="decimal" min="0" step="any" value="${p ? p.precio : ""}"></div>
      <div><label class="lbl" for="prod-costo">Costo</label><input type="number" id="prod-costo" inputmode="decimal" min="0" step="any" value="${p ? p.costo : ""}"></div>
    </div>
    <label class="chk"><input type="checkbox" id="prod-activo" ${!p || p.activo ? "checked" : ""}> Visible en el punto de venta</label>
    <p class="nota-pequena" style="margin-top:10px">Guardar cambios requiere la clave de administrador. Si renombras un producto, las ventas anteriores conservan el nombre viejo.</p>
    <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="ok" onclick="guardarProducto(${idx})">Guardar</button></div>
    ${p ? `<div class="acciones-modal" style="margin-top:8px"><button class="peligro" onclick="eliminarProducto(${idx})">Eliminar producto</button></div>` : ""}`);
  enfocar("prod-nombre");
}
async function guardarProducto(idx) {
  const p = idx >= 0 ? productosAdmin[idx] : null;
  const d = { action: "guardarProducto", id: p ? p.id : "", nombre: $("prod-nombre").value.trim(), categoria: $("prod-cat").value.trim(), precio: parseFloat($("prod-precio").value), costo: parseFloat($("prod-costo").value) || 0, activo: $("prod-activo").checked };
  if (!d.nombre) return toast("Escribe el nombre del producto", "error");
  if (isNaN(d.precio) || d.precio < 0) return toast("Escribe un precio válido", "error");
  const r = await accionAdmin(d, "Guardar productos requiere la clave de administrador.");
  if (!r) return;
  cerrarModal(); toast("Producto guardado");
  await cargarProductosAdmin(); descargarMenu();
}
async function eliminarProducto(idx) {
  const p = productosAdmin[idx]; if (!p) return;
  if (!confirm("¿Eliminar " + p.nombre + " del catálogo? Las ventas anteriores se conservan. Si solo quieres ocultarlo, desmarca \"Visible\".")) return;
  cerrarModal();
  const r = await accionAdmin({ action: "eliminarProducto", id: p.id }, "Eliminar productos requiere la clave de administrador.");
  if (r) { toast("Producto eliminado"); await cargarProductosAdmin(); descargarMenu(); }
}

/* ============================ EDITAR / ELIMINAR TICKETS ============================ */
function editarTicket(i) {
  const t = ticketsCache[i]; if (!t) return;
  editor = {
    folio: t.folio, metodoPago: t.metodo, cliente: t.cliente || "", tipo: t.tipo || "", descuento: t.descuento || 0,
    items: t.items.map(x => ({ producto: x.nombre, cantidad: x.cantidad, precioUnitario: x.precio, costoUnitario: x.costo || 0, nota: x.nota || "" }))
  };
  renderEditor();
}
function renderEditor() {
  const e = editor;
  abrirModal(`
    <h3>Editar ticket ${esc(e.folio)}</h3>
    <p class="nota-pequena">Cambia cantidad y precio de cada línea. Al guardar se pedirá la clave de administrador.</p>
    <div class="editor-linea" style="border-bottom:none;padding-bottom:0"><span class="nota-pequena" style="margin:0">Producto</span><span class="nota-pequena" style="margin:0;text-align:right">Cant.</span><span class="nota-pequena" style="margin:0;text-align:right">Precio</span><span></span></div>
    ${e.items.map((it, k) => `
      <div class="editor-linea">
        <div><strong style="font-size:13px">${esc(it.producto)}</strong>${it.nota ? `<br><small style="color:var(--ambar);font-style:italic">${esc(it.nota)}</small>` : ""}</div>
        <input type="number" min="0" step="any" inputmode="decimal" value="${it.cantidad}" aria-label="Cantidad" oninput="edCambio(${k},'cantidad',this.value)">
        <input type="number" min="0" step="any" inputmode="decimal" value="${it.precioUnitario}" aria-label="Precio unitario" oninput="edCambio(${k},'precioUnitario',this.value)">
        <button class="btn-cant" onclick="edQuitar(${k})" aria-label="Quitar línea">×</button>
      </div>`).join("")}
    <label class="lbl" for="ed-agregar">Agregar producto</label>
    <div style="display:flex;gap:8px"><select id="ed-agregar" class="campo-sel">${productos.map(p => `<option value="${esc(p.id)}">${esc(p.nombre)} (${fmt(p.precio)})</option>`).join("")}</select><button class="btn" onclick="edAgregar()">Agregar</button></div>
    <label class="lbl" for="ed-metodo">Método de pago</label>
    <select id="ed-metodo" class="campo-sel" onchange="edCampo('metodoPago',this.value)">${["Efectivo", "Tarjeta", "Transferencia", "Crédito"].map(m => `<option ${m === e.metodoPago ? "selected" : ""}>${m}</option>`).join("")}</select>
    <label class="lbl" for="ed-cliente">Cliente</label>
    <input type="text" id="ed-cliente" list="lista-clientes-ed" value="${esc(e.cliente)}" autocomplete="off" oninput="edCampo('cliente',this.value)">
    <datalist id="lista-clientes-ed">${clientesCache.map(c => `<option value="${esc(c.nombre)}">`).join("")}</datalist>
    <div class="dos-col">
      <div><label class="lbl" for="ed-tipo">Consumo</label><select id="ed-tipo" class="campo-sel" onchange="edCampo('tipo',this.value)">${[["", "Sin registrar"], ["Aquí", "Aquí"], ["Llevar", "Para llevar"]].map(([v, t]) => `<option value="${v}" ${v === e.tipo ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div><label class="lbl" for="ed-desc">Descuento en pesos</label><input type="number" id="ed-desc" min="0" step="any" inputmode="decimal" value="${e.descuento || ""}" oninput="edCampo('descuento',this.value)"></div>
    </div>
    <div class="fila fuerte" style="margin-top:14px"><span>Total</span><span id="ed-total"></span></div>
    <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="ok" onclick="guardarEdicion()">Guardar cambios</button></div>`);
  edTotales();
}
function edCambio(k, campo, v) { editor.items[k][campo] = parseFloat(v) || 0; edTotales(); }
function edCampo(c, v) { editor[c] = c === "descuento" ? (parseFloat(v) || 0) : v; edTotales(); }
function edQuitar(k) { editor.items.splice(k, 1); renderEditor(); }
function edAgregar() {
  const p = productos.find(x => String(x.id) === $("ed-agregar").value); if (!p) return;
  editor.items.push({ producto: p.nombre, cantidad: 1, precioUnitario: p.precio, costoUnitario: p.costo || 0, nota: "" });
  renderEditor();
}
function edTotales() {
  const sub = redondear(editor.items.reduce((s, x) => s + x.cantidad * x.precioUnitario, 0));
  const desc = Math.min(Math.max(editor.descuento || 0, 0), sub);
  $("ed-total").textContent = fmt(sub - desc);
}
async function guardarEdicion() {
  const e = editor;
  if (!e.items.length) return toast("El ticket necesita al menos un producto", "error");
  if (e.items.some(x => !(x.cantidad > 0))) return toast("Revisa las cantidades: deben ser mayores a cero", "error");
  if (e.metodoPago === "Crédito" && !String(e.cliente).trim()) return toast("El crédito requiere el nombre del cliente", "error");
  const r = await accionAdmin({ action: "editarTicket", ...e }, "Editar un ticket requiere la clave de administrador.");
  if (!r) { if (editor) renderEditor(); return; }
  editor = null; cerrarModal(); toast("Ticket actualizado");
  cargarTickets(); cargarCreditos(); cargarHoy(); cargarClientes();
}
function pedirEliminarTicket(i) {
  const t = ticketsCache[i]; if (!t) return;
  abrirModal(`
    <h3>Eliminar ticket ${esc(t.folio)}</h3>
    <p class="nota-pequena">Se borrará de la hoja de forma permanente y dejará de contar en el corte y en los reportes. Si prefieres conservar el registro, usa Anular.</p>
    <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="peligro" onclick="eliminarTicket('${esc(t.folio)}')">Eliminar</button></div>`);
}
async function eliminarTicket(folio) {
  cerrarModal();
  const r = await accionAdmin({ action: "eliminarTicket", folio }, "Eliminar un ticket requiere la clave de administrador.");
  if (r) { toast("Ticket eliminado"); cargarTickets(); cargarCreditos(); cargarHoy(); cargarClientes(); }
}

/* ============================ INICIO ============================ */
aplicarTema(leer("pos_tema", window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro"));
$("fecha-corte").value = hoy(); $("fecha-tickets").value = hoy();
marcarTipo(); actualizarCarrito(); actualizarEstadoSync(); pintarMeta();
descargarMenu().then(() => { cargarCreditos(); cargarClientes(); procesarCola(); cargarHoy(); });
setInterval(cargarHoy, 120000);
</script>
