<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>POS Pro - Café Sierra Escondida (Firebase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Paleta: niebla de sierra, pino y espresso ============ */
:root {
  --bg: #F1F2EE; --surface: #FFFFFF; --ink: #211B17; --muted: #7B7269; --line: #E3E4DD;
  --pino: #2E4A3E; --pino-ink: #FFFFFF; --salvia: #E1E9E2; --ambar: #A8691A; --ambar-bg: #F7EAD2;
  --rojo: #B3382C; --rojo-bg: #F5DCD8; --r-s: 10px; --r-m: 14px; --r-l: 22px;
  --fuente: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
[data-tema="oscuro"] {
  --bg: #14110F; --surface: #1D1916; --ink: #F2EDE5; --muted: #9A8F84; --line: #2D2823;
  --pino: #8CBFA0; --pino-ink: #10201A; --salvia: #233229;
  --ambar: #E0A94A; --ambar-bg: #3A2D14; --rojo: #E57F72; --rojo-bg: #3B1E1A;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--fuente); background: var(--bg); color: var(--ink);
  display: grid; grid-template-columns: 84px 1fr; height: 100dvh; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pino); outline-offset: 2px; }
.ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ico.s { width: 18px; height: 18px; }

.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; overflow-y: auto; }
.marca { width: 46px; height: 46px; border-radius: 16px; background: var(--pino); color: var(--pino-ink); display: grid; place-items: center; margin-bottom: 14px; }
.nav-btn { position: relative; width: 66px; padding: 10px 0 8px; border: none; background: none; border-radius: var(--r-m); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
.nav-btn:hover { background: var(--bg); }
.nav-btn.activo { background: var(--salvia); color: var(--pino); }
.badge { position: absolute; top: 4px; right: 10px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ambar); color: #fff; font-size: 10px; display: none; place-items: center; padding: 0 5px; }
.rail-fin { margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--ink); background: var(--bg); }

.contenido { display: flex; flex-direction: column; min-width: 0; height: 100dvh; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 24px 8px; flex-wrap: wrap; }
.topbar h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.topbar .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
.hoy { display: flex; align-items: center; gap: 12px; }
.meta-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 8px 14px; text-align: left; min-width: 190px; }
.meta-btn .fila-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
.meta-btn strong { font-size: 15px; color: var(--ink); }
.barra { height: 5px; background: var(--salvia); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--pino); border-radius: 3px; width: 0; transition: width .5s; }
.chip-sync { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--pino); }
.chip-sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--pino); }

.vista { display: none; flex: 1; min-height: 0; }
.vista.activa { display: flex; }
.vista-pagina { padding: 8px 24px 24px; overflow-y: auto; flex-direction: column; gap: 14px; }

#v-vender { display: none; gap: 20px; padding: 8px 24px 0 24px; }
#v-vender.activa { display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
.catalogo { display: flex; flex-direction: column; min-height: 0; padding-bottom: 20px; }
.busqueda { position: relative; }
.busqueda .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.busqueda input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); font-size: 15px; }
.busqueda kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 11px var(--fuente); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; flex-shrink: 0; scrollbar-width: none; }
.chip { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip.activo { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid-productos { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); grid-auto-rows: 104px; gap: 10px; align-content: start; padding: 2px 4px 4px 2px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color .12s, background .12s; }
.tile:hover { border-color: var(--pino); }
.tile:active { background: var(--salvia); }
.tile .nombre { font-weight: 700; font-size: 14px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile .pie { display: flex; justify-content: space-between; align-items: baseline; }
.tile .precio { font-weight: 800; font-size: 16px; color: var(--pino); }
.tile .cat { font-size: 11px; color: var(--muted); }
.tile .en-pedido { font-size: 11px; font-weight: 700; background: var(--pino); color: var(--pino-ink); border-radius: 10px; padding: 1px 8px; }

.comanda { position: relative; background: var(--surface); border-radius: var(--r-l) var(--r-l) 0 0; margin: 0 0 22px; display: flex; flex-direction: column; min-height: 0; padding: 18px 18px 6px; }
.comanda::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
  background: linear-gradient(135deg, var(--surface) 33.33%, transparent 33.33%) 0 0 / 14px 10px, linear-gradient(225deg, var(--surface) 33.33%, transparent 33.33%) 0 0 / 14px 10px; }
.comanda-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.comanda-cab h2 { margin: 0; font-size: 18px; font-weight: 800; }
.seg { display: inline-flex; background: var(--bg); border-radius: 12px; padding: 3px; }
.seg button { border: none; background: none; padding: 6px 12px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
.seg button.activo { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.lista-carrito { flex: 1; overflow-y: auto; min-height: 80px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item .nom { font-weight: 700; font-size: 14px; }
.item .imp { font-weight: 700; font-size: 14px; text-align: right; }
.item .nota-txt { font-size: 12px; color: var(--ambar); font-style: italic; }
.item .ctrl { display: flex; align-items: center; gap: 6px; grid-column: 1 / -1; flex-wrap: wrap; }
.btn-cant { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 1; display: grid; place-items: center; }
.btn-cant:hover { background: var(--salvia); }
.item .q { min-width: 22px; text-align: center; font-weight: 800; }
.link-btn { border: none; background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; margin-left: auto; }
.link-btn:hover { background: var(--bg); color: var(--ink); }
.link-btn.peligro:hover { color: var(--rojo); background: var(--rojo-bg); }
.vacio { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 8px; line-height: 1.5; }
.comanda-pie { padding: 12px 0 14px; }
.fila-desc { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.fila-desc input { width: 72px; padding: 7px 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg); }
.fila-desc select { padding: 7px 6px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg); }
.fila-t { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 2px 0; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 12px; }
.pagos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn-pago { padding: 13px 6px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.btn-pago:hover:not(:disabled) { border-color: var(--pino); }
.btn-pago:disabled { opacity: .4; cursor: not-allowed; }
.btn-principal { grid-column: 1 / -1; background: var(--pino); color: var(--pino-ink); border-color: var(--pino); flex-direction: row; justify-content: center; font-size: 16px; padding: 16px; gap: 8px; }
.btn-principal:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--pino); }
#fab-pedido { display: none; }

.barra-filtros { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.barra-filtros input[type=date] { padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
.btn { padding: 10px 16px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; }
.btn:hover { border-color: var(--pino); }
.btn.relleno { background: var(--pino); color: var(--pino-ink); border-color: var(--pino); }
.btn.peligro { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.panel { background: var(--surface); border-radius: var(--r-l); padding: 18px 20px; overflow-x: auto; }
.panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.fila { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; }
.fila.fuerte { font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border-radius: var(--r-l); padding: 16px 18px; }
.kpi .t { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; }
.kpi.principal { background: var(--pino); color: var(--pino-ink); }
.cols-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.campo { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
.campo input { width: 120px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg); text-align: right; }

.lista-t { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-l); overflow: hidden; }
.fila-t2 { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 12px; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: none; border-right: none; border-top: none; width: 100%; font-size: 14px; }
.fila-t2:last-child { border-bottom: none; }
button.fila-t2:hover { background: var(--bg); }
.fila-t2 .hora { color: var(--muted); font-weight: 600; }
.fila-t2 .sub { display: block; font-size: 12px; color: var(--muted); }
.fila-t2 .monto { font-weight: 800; }
.fila-t2.anulado { opacity: .5; } .fila-t2.anulado .monto { text-decoration: line-through; }
.etq { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
.etq.pend { background: var(--ambar-bg); color: var(--ambar); }
.etq.anul { background: var(--rojo-bg); color: var(--rojo); }
.etq.ok { background: var(--salvia); color: var(--pino); }

.cliente-card { background: var(--surface); border-radius: var(--r-l); padding: 16px 20px; }
.cliente-card .cab { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 16px; margin-bottom: 6px; }
.cliente-card .cab span:last-child { color: var(--ambar); }
.fila-credito { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }

#modal { display: none; position: fixed; inset: 0; background: rgba(20,17,15,.55); justify-content: center; align-items: center; z-index: 2000; padding: 14px; backdrop-filter: blur(2px); }
.modal-contenido { background: var(--surface); padding: 22px; border-radius: var(--r-l); width: 400px; max-width: 100%; max-height: 92vh; overflow-y: auto; }
.modal-contenido h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
.nota-pequena { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 5px; }
.modal-contenido input[type=number], .modal-contenido input[type=text], .modal-contenido input[type=password], .modal-contenido input[type=tel], .modal-contenido input[type=email] { width: 100%; padding: 13px; font-size: 18px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); }
.total-modal { font-size: 40px; font-weight: 800; text-align: center; letter-spacing: -.02em; margin: 6px 0; }
.rapidos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rapidos button { padding: 9px 13px; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-s); font-weight: 700; font-size: 13px; }
.cambio { margin-top: 14px; text-align: center; font-size: 22px; font-weight: 800; color: var(--pino); }
.cambio.falta { color: var(--rojo); }
.acciones-modal { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.acciones-modal button { flex: 1; padding: 13px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.acciones-modal .ok { background: var(--pino); color: var(--pino-ink); border-color: var(--pino); }
.acciones-modal .peligro { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.chk { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; font-weight: 600; }
.exito { text-align: center; }
.exito .check { width: 64px; height: 64px; border-radius: 50%; background: var(--salvia); color: var(--pino); display: grid; place-items: center; margin: 0 auto 8px; }
.exito .check .ico { width: 32px; height: 32px; stroke-width: 2.4; }
.sugeridas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sugeridas button { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 600; }
#overlay-carga { display: flex; position: fixed; inset: 0; background: var(--bg); justify-content: center; align-items: center; flex-direction: column; gap: 14px; font-size: 16px; font-weight: 700; z-index: 3000; color: var(--muted); }
#overlay-carga .marca { margin: 0; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 4000; display: none; max-width: 90%; }
#toast.error { background: var(--rojo); color: #fff; } #toast.aviso { background: var(--ambar); color: #fff; }

.solo-mov { display: none; }
.lista-cards { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-l); overflow: hidden; }
.fila-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 13px 18px; border: none; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; font-size: 14px; }
.fila-item:last-child { border-bottom: none; }
button.fila-item:hover { background: var(--bg); }
.fila-item.inactivo { opacity: .5; }
.fila-item .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.fila-item .monto { font-weight: 800; text-align: right; }
.fila-cliente { display: flex; gap: 8px; margin-bottom: 10px; }
.cliente-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); font-weight: 700; font-size: 13px; text-align: left; }
.cliente-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-mini { padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); font-weight: 700; font-size: 12px; white-space: nowrap; }
.banner { background: var(--salvia); color: var(--pino); border-radius: var(--r-s); padding: 6px 6px 6px 12px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.precio-edit { border: none; background: none; font-size: 12px; color: var(--muted); padding: 6px; border-radius: 8px; text-decoration: underline dotted; }
.precio-edit.cambiado { color: var(--ambar); font-weight: 700; }
.btn-ancho { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 8px; }
.lista-sel { max-height: 44vh; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; }
.sel-item { text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 12px 4px; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.campo-sel { width: 100%; padding: 13px; font-size: 16px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); }
.editor-linea { display: grid; grid-template-columns: minmax(0, 1fr) 62px 84px 34px; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.modal-contenido .editor-linea input[type=number] { width: 100%; padding: 9px 6px; font-size: 15px; border-radius: 8px; text-align: right; }
.dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu-mas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.menu-mas button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); font-size: 12px; font-weight: 700; }
table.tabla { min-width: 460px; width: 100%; border-collapse: collapse; font-size: 13px; }
table.tabla th { text-align: right; font-weight: 600; color: var(--muted); padding: 6px 4px; font-size: 12px; }
table.tabla td { text-align: right; padding: 9px 4px; border-top: 1px solid var(--line); }
table.tabla th:first-child, table.tabla td:first-child { text-align: left; font-weight: 600; }

#ticket-print, #cot-print { display: none; }
@media print {
  @page { margin: 0; }
  body { display: block; height: auto; overflow: visible; background: #fff; }
  body:not(.imprimiendo-cot) > *:not(#ticket-print) { display: none !important; }
  body.imprimiendo-cot > *:not(#cot-print) { display: none !important; }
  body:not(.imprimiendo-cot) #ticket-print { display: block; width: 72mm; padding: 4mm; font-family: monospace; font-size: 12px; color: #000; }
  #ticket-print hr { border: none; border-top: 1px dashed #000; }
  #ticket-print .tp-centro { text-align: center; }
  #ticket-print .tp-fila { display: flex; justify-content: space-between; gap: 6px; }
}

@media (max-width: 1100px) { #v-vender.activa { grid-template-columns: minmax(0, 1fr) 340px; } }
@media (max-width: 860px) {
  body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .contenido { height: 100%; min-height: 0; }
  .rail { order: 2; flex-direction: row; justify-content: space-around; align-items: stretch; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); border-right: none; border-top: 1px solid var(--line); gap: 0; overflow: visible; }
  .marca, .rail-fin, .solo-desk { display: none !important; }
  .solo-mov { display: flex; }
  .nav-btn { width: auto; flex: 1; padding: 8px 0 6px; font-size: 10.5px; }
  .badge { right: 18%; }
  input, select { font-size: 16px; }
  .topbar { flex-wrap: nowrap; padding: 10px 14px 4px; gap: 10px; }
  .topbar h1 { font-size: 19px; }
  .topbar .sub, #hoy-tickets { display: none; }

<!-- FIREBASE SDK v10 (MODULE) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, orderBy, getDoc, setDoc 
} from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

// Tu Configuración de Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBXRIqA9AD15ZCF-HI0bq-Ie2fCAA2jR-M",
  authDomain: "punto-de-venta-e113c.firebaseapp.com",
  projectId: "punto-de-venta-e113c",
  storageBucket: "punto-de-venta-e113c.firebasestorage.app",
  messagingSenderId: "694466401488",
  appId: "1:694466401488:web:28f231d6de441bd623fad5",
  measurementId: "G-MB8H30Y6LB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ============================ BINDINGS GLOBALES ============================ */
const NEGOCIO = { nombre: "Café Sierra Escondida", leyenda: "¡Gracias por tu visita!" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => "$" + (Number(n) || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-MX");
const redondear = n => Math.round((Number(n) || 0) * 100) / 100;
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const hoy = () => iso(new Date());
const nuevoUid = () => Math.random().toString(36).slice(2, 9);
const leer = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const icono = (id, cls = "") => `<svg class="ico ${cls}"><use href="#i-${id}"/></svg>`;

let toastTimer;
function toast(msg, tipo = "") { const t = $("toast"); t.textContent = msg; t.className = tipo; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3200); }
function mostrarOverlay(txt) { $("overlay-texto").textContent = txt; $("overlay-carga").style.display = "flex"; }
function ocultarOverlay() { $("overlay-carga").style.display = "none"; }
function abrirModal(html) { $("modal-cuerpo").innerHTML = html; $("modal").style.display = "flex"; }
function cerrarModal() { $("modal").style.display = "none"; }

/* ============================ ESTADO LOCAL ============================ */
let productos = [], productosAdmin = [];
let carrito = leer("pos_carrito", []).map(i => ({ ...i, uid: i.uid || nuevoUid(), precioBase: i.precioBase ?? i.precio }));
let categoriaActiva = "TODAS", tipoOrden = leer("pos_tipo", "Aquí");
let clienteActual = leer("pos_cliente", null), cotizacionOrigen = leer("pos_cot", null);
let clientesCache = [], ticketsCache = [], creditosCache = [], cotizacionesCache = [];
let hoyVentas = 0, pagoActual = null;

/* ============================ FIREBASE API LOGIC ============================ */

// 1. PRODUCTOS
window.cargarProductos = async function() {
  mostrarOverlay("Cargando productos...");
  try {
    const qSnap = await getDocs(collection(db, "productos"));
    productos = []; productosAdmin = [];
    qSnap.forEach(docSnap => {
      const p = { id: docSnap.id, ...docSnap.data() };
      productosAdmin.push(p);
      if (p.activo !== false) productos.push(p);
    });
    poblarCategorias(); filtrarProductos(); renderProductosAdmin();
  } catch (e) { toast("Error al cargar productos", "error"); }
  finally { ocultarOverlay(); }
};

window.guardarProducto = async function(id = "") {
  const nombre = $("prod-nombre").value.trim();
  const precio = parseFloat($("prod-precio").value);
  const costo = parseFloat($("prod-costo").value) || 0;
  const categoria = $("prod-cat").value.trim();
  const activo = $("prod-activo").checked;
  if (!nombre || isNaN(precio)) return toast("Escribe un nombre y precio válidos", "error");

  mostrarOverlay("Guardando producto...");
  try {
    const pData = { nombre, precio, costo, categoria, activo };
    if (id) {
      await updateDoc(doc(db, "productos", id), pData);
    } else {
      await addDoc(collection(db, "productos"), pData);
    }
    cerrarModal(); toast("Producto guardado"); await window.cargarProductos();
  } catch(e) { toast("Error al guardar", "error"); }
  finally { ocultarOverlay(); }
};

window.eliminarProductoFB = async function(id) {
  if(!confirm("¿Borrar producto de la base de datos?")) return;
  mostrarOverlay("Eliminando...");
  try {
    await deleteDoc(doc(db, "productos", id));
    cerrarModal(); toast("Producto eliminado"); await window.cargarProductos();
  } catch(e) { toast("Error al eliminar", "error"); }
  finally { ocultarOverlay(); }
};

// 2. VENTAS / TICKETS
window.confirmarCobro = async function() {
  if (!pagoActual) return;
  const t = calcularTotales(), metodo = pagoActual.metodo;
  const cliente = clienteActual ? clienteActual.nombre : "";
  if (metodo === "Crédito" && !cliente) return toast("Debes elegir un cliente para el crédito", "error");

  const folio = "V-" + Date.now().toString(36).toUpperCase();
  const ventaData = {
    folio, fecha: hoy(), hora: new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" }),
    ts: Date.now(), metodo, cliente, descuento: t.desc, tipo: tipoOrden, estado: metodo === "Crédito" ? "Pendiente" : "Pagado",
    total: t.total, subtotal: t.subtotal, items: carrito.map(i => ({ nombre: i.nombre, cantidad: i.cantidad, precio: i.precio, costo: i.costo || 0, nota: i.nota || "" }))
  };

  mostrarOverlay("Procesando cobro...");
  try {
    await addDoc(collection(db, "ventas"), ventaData);
    if (cotizacionOrigen) {
      const qSnap = await getDocs(query(collection(db, "cotizaciones"), where("folio", "==", cotizacionOrigen)));
      qSnap.forEach(async dSnap => { await updateDoc(doc(db, "cotizaciones", dSnap.id), { estado: "Convertida", venta: folio }); });
    }
    
    // Si fue cliente a crédito, actualizar pendiente
    if (clienteActual && clienteActual.id) {
      const cRef = doc(db, "clientes", clienteActual.id);
      const cSnap = await getDoc(cRef);
      if (cSnap.exists()) {
        const cData = cSnap.data();
        await updateDoc(cRef, { 
          totalComprado: redondear((cData.totalComprado || 0) + t.total),
          numTickets: (cData.numTickets || 0) + 1,
          pendiente: metodo === "Crédito" ? redondear((cData.pendiente || 0) + t.total) : (cData.pendiente || 0)
        });
      }
    }

    cerrarModal();
    const resumen = { ...ventaData, fechaTxt: ventaData.fecha, horaTxt: ventaData.hora, recibido: parseFloat($("pago-recibido")?.value) \vert{}\vert{} t.total, cambio: parseFloat($("pago-recibido")?.value) - t.total || 0 };
    if ($("pago-imprimir")?.checked) window.imprimirResumen(resumen);
    carrito = []; clienteActual = null; cotizacionOrigen = null;
    guardar("pos_cliente", null); guardar("pos_cot", null); actualizarCarrito();
    toast("Venta exitosa"); cargarHoy();
  } catch (e) { toast("Error al procesar la venta", "error"); }
  finally { ocultarOverlay(); }
};

window.cargarTickets = async function() {
  const f = $("fecha-tickets").value || hoy();
  mostrarOverlay("Cargando tickets...");
  try {
    const q = query(collection(db, "ventas"), where("fecha", "==", f));
    const qSnap = await getDocs(q);
    ticketsCache = [];
    qSnap.forEach(d => ticketsCache.push({ id: d.id, ...d.data() }));
    ticketsCache.sort((a,b) => b.ts - a.ts);
    renderTickets();
  } catch(e) { toast("Error al cargar tickets", "error"); }
  finally { ocultarOverlay(); }
};

window.anularTicketFB = async function(id) {
  if(!confirm("¿Anular este ticket? Dejará de contar en ventas.")) return;
  mostrarOverlay("Anulando...");

    await updateDoc(doc(db, "ventas", id), { estado: "Anulado" });
    cerrarModal(); toast("Ticket Anulado"); window.cargarTickets(); cargarHoy();
  } catch(e) { toast("Error al anular", "error"); }
  finally { ocultarOverlay(); }
};

// 3. CREDITOS Y CLIENTES
window.cargarClientes = async function() {

window.guardarClienteFB = async function(id = "") {
  const nombre = $("cli-nombre").value.trim();
  const telefono = $("cli-tel").value.trim();
  const email = $("cli-email").value.trim();
  const notas = $("cli-notas").value.trim();
  if(!nombre) return toast("Escribe el nombre", "error");

  mostrarOverlay("Guardando cliente...");
  try {
    const data = { nombre, telefono, email, notas };
    if (id) await updateDoc(doc(db, "clientes", id), data);
    else await addDoc(collection(db, "clientes"), { ...data, totalComprado: 0, numTickets: 0, pendiente: 0 });
    cerrarModal(); toast("Cliente guardado"); window.cargarClientes();
  } catch(e) { toast("Error al guardar", "error"); }
  finally { ocultarOverlay(); }
};

window.cargarCreditos = async function() {
  mostrarOverlay("Cargando créditos...");

    const q = query(collection(db, "ventas"), where("estado", "==", "Pendiente"));
    const qSnap = await getDocs(q);

};

window.cobrarCreditoFB = async function(id, metodo) {

// 4. COTIZACIONES
window.guardarCotizacionFB = async function() {
  const cliente = $("cot-cliente").value.trim();
  const tel = $("cot-tel").value.trim();
  const vig = parseInt($("cot-vig").value) || 7;
  const notas = $("cot-notas").value.trim();
  const t = calcularTotales();

  const cot = {
    folio: "C-" + Date.now().toString(36).toUpperCase(), fecha: hoy(), cliente, telefono: tel,
    total: t.total, vigencia: iso(new Date(Date.now() + vig * 86400000)), estado: "Pendiente",
    items: carrito.map(i => ({ nombre: i.nombre, cantidad: i.cantidad, precio: i.precio, nota: i.nota || "" })), descuento: t.desc, notas
  };

  mostrarOverlay("Guardando cotización...");
  try {
    await addDoc(collection(db, "cotizaciones"), cot);
    cerrarModal(); toast("Cotización guardada");
  } catch(e) { toast("Error al guardar", "error"); }
  finally { ocultarOverlay(); }
};

window.cargarCotizaciones = async function() {
  mostrarOverlay("Cargando cotizaciones...");
  try {
    const qSnap = await getDocs(collection(db, "cotizaciones"));
    cotizacionesCache = [];
    qSnap.forEach(d => cotizacionesCache.push({ id: d.id, ...d.data() }));

  finally { ocultarOverlay(); }
};

// 5. IMPORTADOR DESDE GOOGLE SHEETS (MIGRACIÓN)
window.migrarDeGoogleSheets = async function() {
  const url = prompt("Pega aquí la URL de tu antiguo WebApp Exec de Apps Script para traer tu menú actual:");
  if (!url) return;
  mostrarOverlay("Importando desde Sheets...");
  try {
    const r = await fetch(url + "?action=menu");
    const data = await r.json();
    if (Array.isArray(data)) {
      for (let p of data) {
        await addDoc(collection(db, "productos"), {
          nombre: p.nombre, categoria: p.categoria || "General", precio: parseFloat(p.precio) || 0, costo: parseFloat(p.costo) || 0, activo: true
        });
      }
      toast("¡Importación exitosa! Tu menú ahora está en Firebase.");
      window.cargarProductos();
    }
  } catch(e) { toast("Error al importar", "error"); }
  finally { ocultarOverlay(); }
};

/* ============================ UI & RENDERING ============================ */
function poblarCategorias() {
  const cats = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
  const lista = ["TODAS", ...cats];
  $("chips").innerHTML = lista.map(c => `<button class="chip ${c === categoriaActiva ? "activo" : ""}" onclick="setCat('${esc(c)}')">${c === "TODAS" ? "Todo" : esc(c)}</button>`).join("");
}
window.setCat = c => { categoriaActiva = c; poblarCategorias(); filtrarProductos(); };

function filtrarProductos() {
  const txt = $("input-buscar").value.toLowerCase().trim();
  const list = productos.filter(p => (categoriaActiva === "TODAS" || p.categoria === categoriaActiva) && p.nombre.toLowerCase().includes(txt));
  renderGridProductos(list);
}
window.filtrarProductos = filtrarProductos;

function renderGridProductos(list) {
  const grid = $("grid-productos");
  if (!list.length) { grid.innerHTML = '<p class="vacio" style="grid-column:1/-1">No hay productos.</p>'; return; }
  grid.innerHTML = list.map(p => `
    <button class="tile" onclick="agregarAlCarrito('${esc(p.id)}')">
      <span class="nombre">${esc(p.nombre)}</span>
      <span class="pie"><span class="precio">${fmt(p.precio)}</span><span class="cat">${esc(p.categoria || "")}</span></span>
    </button>`).join("");
}

window.agregarAlCarrito = function(id) {
  const p = productos.find(x => String(x.id) === String(id)); if (!p) return;
  const it = carrito.find(x => String(x.id) === String(id));
  if (it) it.cantidad++; else carrito.push({ uid: nuevoUid(), id: p.id, nombre: p.nombre, precio: p.precio, precioBase: p.precio, costo: p.costo || 0, cantidad: 1, nota: "" });
  actualizarCarrito();
};

function calcularTotales() {
  const subtotal = redondear(carrito.reduce((s, i) => s + i.precio * i.cantidad, 0));
  const valor = parseFloat($("desc-valor").value) || 0;
  let desc = $("desc-tipo").value === "%" ? subtotal * Math.min(valor, 100) / 100 : valor;
  desc = redondear(Math.min(Math.max(desc, 0), subtotal));
  return { subtotal, desc, total: redondear(subtotal - desc) };
}

function actualizarCarrito() {
  const t = calcularTotales();
  guardar("pos_carrito", carrito);
  $("lista-carrito").innerHTML = !carrito.length ? '<p class="vacio">Pedido vacío</p>' : carrito.map(i => `
    <div class="item">
      <div><div class="nom">${esc(i.nombre)}</div></div>
      <div class="imp">${fmt(i.precio * i.cantidad)}</div>
      <div class="ctrl">
        <button class="btn-cant" onclick="cambiarCant('${i.uid}', -1)">−</button>
        <span class="q">${i.cantidad}</span>
        <button class="btn-cant" onclick="cambiarCant('${i.uid}', 1)">+</button>
        <span style="font-size:12px">${fmt(i.precio)}</span>
        <button class="link-btn peligro" onclick="quitarItem('${i.uid}')">Quitar</button>
      </div>
    </div>`).join("");
  $("subtotal").textContent = fmt(t.subtotal);
  $("gran-total").textContent = fmt(t.total);
}
window.cambiarCant = (uid, d) => { const it = carrito.find(x => x.uid === uid); if(it){ it.cantidad += d; if(it.cantidad <= 0) carrito = carrito.filter(x => x.uid !== uid); actualizarCarrito(); } };
window.quitarItem = uid => { carrito = carrito.filter(x => x.uid !== uid); actualizarCarrito(); };
window.vaciarCarrito = () => { carrito = []; actualizarCarrito(); };

window.iniciarCobro = function(metodo) {
  if (!carrito.length) return toast("El pedido está vacío", "aviso");
  const t = calcularTotales(); pagoActual = { metodo, total: t.total };
  abrirModal(`
    <h3>Cobrar ${metodo}</h3>
    <div class="total-modal">${fmt(t.total)}</div>
    ${metodo === "Efectivo" ? `<input type="number" id="pago-recibido" placeholder="Efectivo recibido">` : ""}
    <label class="chk"><input type="checkbox" id="pago-imprimir"> Imprimir ticket</label>
    <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="ok" onclick="window.confirmarCobro()">Confirmar</button></div>`);
};

function renderTickets() {
  $("contenedor-tickets").innerHTML = ticketsCache.map(t => `
    <div class="fila-t2 ${t.estado === "Anulado" ? "anulado" : ""}">
      <span class="hora">${esc(t.hora)}</span>
      <span>${esc(t.folio)}<span class="sub">${esc(t.metodo)} ${t.cliente ? "- " + esc(t.cliente) : ""}</span></span>
      <span class="monto">${fmt(t.total)}</span>

}

    ${t.items.map(i => `<div class="fila"><span>${i.cantidad}x ${i.nombre}</span><span>${fmt(i.precio * i.cantidad)}</span></div>`).join("")}
    <div class="fila fuerte"><span>Total</span><span>${fmt(t.total)}</span></div>
    <div class="acciones-modal">
      ${t.estado !== "Anulado" ? `<button class="peligro" onclick="window.anularTicketFB('${t.id}')">Anular</button>` : ""}

      <button onclick="cerrarModal()">Cerrar</button>

};

    <div class="fila-item">

    <div class="fila-item">
      <span><strong>${esc(p.nombre)}</strong><span class="sub">${esc(p.categoria)}</span></span>

};

function renderCreditos() {
  $("contenedor-creditos").innerHTML = creditosCache.map(c => `
    <div class="cliente-card">
      <div class="cab"><span>${esc(c.cliente)}</span><span>${fmt(c.total)}</span></div>

  abrirModal(`
    <h3>Cobrar crédito</h3>

    <div class="acciones-modal">

};

function renderCotizaciones() {
  $("contenedor-cotizaciones").innerHTML = `<div class="lista-cards">${cotizacionesCache.map(q => `
    <div class="fila-item">
      <span><strong>${esc(q.cliente || "Cliente")}</strong><span class="sub">${q.folio} - Vigente:${q.vigencia}</span></span>

  abrirModal(`
    <h3>Guardar Cotización</h3>
    <input type="text" id="cot-cliente" placeholder="Nombre cliente">
    <input type="tel" id="cot-tel" placeholder="Teléfono">
    <input type="number" id="cot-vig" placeholder="Vigencia en días" value="7">
    <input type="text" id="cot-notas" placeholder="Notas">
    <div class="acciones-modal"><button onclick="cerrarModal()">Cancelar</button><button class="ok" onclick="window.guardarCotizacionFB()">Guardar</button></div>`);
};

async function cargarHoy() {
  try {
    const q = query(collection(db, "ventas"), where("fecha", "==", hoy()));
    const qSnap = await getDocs(q);
    let total = 0, count = 0;
    qSnap.forEach(d => {
      const v = d.data();
      if(v.estado !== "Anulado") { total += v.total; count++; }
    });
    $("hoy-ventas").textContent = fmt0(total);
    $("hoy-tickets").textContent = count + " tickets";
  } catch(e) {}
}

window.irA = function(vista) {
  document.querySelectorAll(".vista").forEach(v => v.classList.toggle("activa", v.id === "v-" + vista));
  if (vista === "tickets") window.cargarTickets();
  if (vista === "creditos") window.cargarCreditos();
  if (vista === "clientes") window.cargarClientes();
  if (vista === "productos") window.cargarProductos();
  if (vista === "cotizaciones") window.cargarCotizaciones();
};

/* ============================ INICIALIZACIÓN ============================ */
window.cargarProductos().then(() => {
  window.cargarClientes();
  cargarHoy();
});
