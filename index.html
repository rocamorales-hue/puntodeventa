in-top:12px;padding:12px;background:#edf4e9;border-radius:11px;color:#3a5b44}.addmethod{border-style:dashed}.info{display:flex;gap:10px;align-items:flex-start;color:#70582a;background:#fbf4e4;border-color:#f1e2c3}@media(max-width:560px){#modal{padding:8px}#modal .box:has(.payhead){padding:17px;max-height:96vh;gap:12px}.paymethods{grid-template-columns:repeat(3,minmax(0,1fr))}.paytotal{padding:14px}.paytotal .big{font-size:31px}.paystat{padding-left:12px}.splitrow{grid-template-columns:minmax(0,1fr) minmax(95px,.8fr) 34px;gap:5px}}
/* refined tables and forms */

<div class="app"><nav class="side" id="nav"></nav><main class="main" id="app"><p class="mu">Cargando…</p></main></div>
<div id="modal" onclick="if(event.target==this)closeM()"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script>
const URL_API='https://script.google.com/macros/s/AKfycbyZsbFkMYhcfYQ8mk9Ca5ani7by_i-cFpplgzcDJyaGlj0SZmC2AdS18WiG1ZdCzZBj/exec';
const $=s=>document.querySelector(s),money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fd=t=>new Date(t).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
dkey=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'#c0392b':'';t.style.color=e?'#fff':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
let KEY='';try{KEY=localStorage.getItem('pos_key')||''}catch(e){}
async function api(f,...a){try{
 if(window.google&&google.script&&google.script.run)return await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[f](...a));
 if(!KEY){KEY=prompt('Clave del POS')||'';try{localStorage.setItem('pos_key',KEY)}catch(e){}}
 const r=await(await fetch(URL_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:f,args:a,key:KEY})})).json();
 if(!r.ok){if(/Clave/.test(r.error)){KEY='';try{localStorage.removeItem('pos_key')}catch(e){}}throw new Error(r.error)}return r.data
}catch(e){toast(e.message||'Error de conexión',1);throw e}}

let S={prods:[],clients:[],ventas:[],cots:[]},cart=[],ed=null,cot=null,cat='Todas',CATS=[],view='vender',TK=[],X={cli:'',nota:''},tipo='Aquí',pm='Efectivo',fe='Pendiente';
const NAV=[['vender','🧾','Vender'],['ventas','📋','Ventas'],['cotizaciones','📝','Cotiz.'],['clientes','👥','Clientes'],['productos','📦','Productos'],['corte','📊','Corte'],['reportes','📈','Reportes'],['configuracion','⚙️','Config.']];
const tot=()=>cart.reduce((s,i)=>s+i.cant*i.precio,0),cnt=()=>cart.reduce((s,i)=>s+i.cant,0);
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 45% 42%)`};
function tickets(){const m={};S.ventas.forEach(v=>{const t=m[v.folio]=m[v.folio]||{folio:v.folio,fecha:v.fecha,cliente:v.cliente,estado:v.estado,metodo:v.metodo,tipo:v.tipo,nota:v.nota,items:[],total:0};t.items.push(v);t.total+=v.total});return Object.values(m).sort((a,b)=>b.fecha-a.fecha)}
async function load(){S=await api('getData');go()}
function go(){$('#nav').innerHTML='<div class=logo>☕</div>'+NAV.map(n=>`<button class="${n[0]==view?'on':''}" onclick="view='${n[0]}';go()"><i>${n[1]}</i>${n[2]}</button>`).join('');
 $('#app').innerHTML=V[view]();if(view=='vender'){chipsR();grid();cartR()}if(view=='ventas')ventasR();if(view=='corte')corteR();if(view=='reportes')reportesR();if(view=='configuracion')configR()}
function modal(h){$('#mbox').innerHTML=h;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}

const V={
vender(){return `<div class=pos><section class=cat><div class=top><input id=q placeholder="🔍  Buscar producto…" oninput=grid()></div><div class=chips id=chips></div><div class=gridwrap><div class=g id=grid></div></div></section>
<aside class=cartp id=cartp><div class=ch><div class=carttitle><div class=cartmark>🧾</div><div class=cartmeta><h3 id=ctitle>Ticket actual</h3><small id=cartstatus class=cartstatus>Listo para capturar venta</small></div></div><div><button class="s sm cartclear" onclick="clearCart()">Vaciar</button> <button class="s sm x" onclick="cartToggle(0)">✕ Cerrar</button></div></div>
<div class=cb><div><label class=fieldlabel for=cli>CLIENTE</label><div class=clientfield><input id=cli list=cl placeholder="Buscar o escribir cliente" value="${esc(X.cli)}" oninput="X.cli=this.value"><span class=fieldicon>⌕</span></div><datalist id=cl>${S.clients.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist></div>
<div><label class=fieldlabel>TIPO DE SERVICIO</label><div class=seg>${['Aquí','Para llevar','Domicilio'].map(t=>`<button class="${t==tipo?'on':''}" onclick="tipo='${t}';document.querySelectorAll('#cartp .seg button').forEach(b=>b.classList.toggle('on',b.textContent=='${t}'));if(document.getElementById('deliveryhint'))document.getElementById('deliveryhint').style.display=tipo==='Domicilio'?'flex':'none'">${t}</button>`).join('')}</div><div id=deliveryhint class=orderhint style="display:${tipo==='Domicilio'?'flex':'none'};margin-top:7px">📍 Agrega la dirección en la nota del pedido.</div></div>

 const debts={}; all.filter(t=>t.estado!='Pagado').forEach(t=>{const n=t.cliente||'Mostrador';debts[n]=(debts[n]||0)+t.total});
 const names=[...new Set([...S.clients.map(c=>c.nombre),...Object.keys(debts)])].filter(n=>n.toLowerCase().includes(q));
 el.innerHTML=`<div class=kpis><div class="card kpi"><span class=mu>Saldo pendiente (periodo)</span><b>${money(Object.values(debts).reduce((a,b)=>a+b,0))}</b></div><div class="card kpi"><span class=mu>Ventas del periodo</span><b>${money(all.reduce((a,t)=>a+t.total,0))}</b></div><div class="card kpi"><span class=mu>Tickets pendientes</span><b>${all.filter(t=>t.estado!='Pagado').length}</b></div></div><div class=list>${names.map(n=>{const ts=all.filter(t=>(t.cliente||'Mostrador')===n);const debe=ts.filter(t=>t.estado!='Pagado').reduce((a,t)=>a+t.total,0);return `<div class=card><div class=tl><b>${esc(n)}</b><span class=tag ${debe?'':'ok'}>${debe?'Debe '+money(debe):'Sin saldo'}</span></div><div class=mu>${ts.length} operaciones en el periodo</div><button class="s sm" onclick="estadoCliente('${esc(n).replace(/'/g,"&#39;")}')">Ver estado de cuenta</button></div>`}).join('')||'<p class=mu>Sin resultados</p>'}</div>`;
}
function estadoCliente(n){const ts=tickets().filter(t=>(t.cliente||'Mostrador')===n);const w=window.open('','_blank');w.document.write(`<html><head><title>Estado de cuenta</title><style>body{font:14px Arial;margin:28px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}h1{font-size:22px}</style></head><body><h1>Estado de cuenta — ${esc(n)}</h1><p>Café Sierra Escondida · ${new Date().toLocaleDateString('es-MX')}</p><table><tr><th>Fecha</th><th>Folio</th><th>Concepto</th><th>Estado</th><th>Total</th></tr>${ts.map(t=>`<tr><td>${fd(t.fecha)}</td><td>${esc(t.folio)}</td><td>${t.items.map(x=>esc(x.producto||x.nombre)).join(', ')}</td><td>${esc(t.estado)}</td><td>${money(t.total)}</td></tr>`).join('')}</table><h2>Saldo pendiente: ${money(ts.filter(t=>t.estado!='Pagado').reduce((a,t)=>a+t.total,0))}</h2></body></html>`);w.document.close();w.print()}
function exportarReporte(){const rows=[['Folio','Fecha','Cliente','Estado','Método','Total'],...tickets().map(t=>[t.folio,fd(t.fecha),t.cliente,t.estado,t.metodo,t.total])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='reporte-pos.csv';a.click();URL.revokeObjectURL(a.href)}
async function configR(){try{const c=await api('getConfig');const m={coNombre:'nombre',coRazon:'razonSocial',coRFC:'rfc',coTel:'telefono',coMail:'correo',coWeb:'web',coDir:'direccion',coCP:'cp',coBanco:'datosBancarios',coColor:'color',coNotas:'notas'};Object.entries(m).forEach(([id,k])=>{if($('#'+id))$('#'+id).value=c[k]||''})}catch(e){}}
async function guardarConfig(){const c={nombre:$('#coNombre').value,razonSocial:$('#coRazon').value,rfc:$('#coRFC').value,telefono:$('#coTel').value,correo:$('#coMail').value,web:$('#coWeb').value,direccion:$('#coDir').value,cp:$('#coCP').value,datosBancarios:$('#coBanco').value,color:$('#coColor').value,notas:$('#coNotas').value};await api('saveConfig',c);toast('Configuración guardada')}
async function printQuote(i){const c=S.cots[i];let conf={};try{conf=await api('getConfig')}catch(e){}const w=window.open('','_blank');w.document.write(`<html><head><title>Cotización ${esc(c.folio)}</title><style>@page{size:letter;margin:18mm}body{font:12px Arial;color:#1f2937}header{border-bottom:3px solid #2563eb;padding-bottom:14px;display:flex;justify-content:space-between}h1{font-size:24px;margin:0}table{width:100%;border-collapse:collapse;margin-top:25px}th{background:#eff6ff}td,th{border:1px solid #dbe4ef;padding:10px;text-align:left}.num{text-align:right}.total{text-align:right;font-size:20px;margin-top:18px}.foot{margin-top:50px;color:#64748b}</style></head><body><header><div><h1>${esc(conf.nombre||'Café Sierra Escondida')}</h1><p>${esc(conf.razonSocial||'')} ${esc(conf.rfc||'')}<br>${esc(conf.direccion||'')} ${esc(conf.cp||'')}<br>${esc(conf.telefono||'')} · ${esc(conf.correo||'')}</p></div><div><h1>COTIZACIÓN</h1><p>Folio: ${esc(c.folio)}<br>Fecha: ${new Date(c.fecha).toLocaleDateString('es-MX')}<br>Vigencia: ${new Date(c.vigencia).toLocaleDateString('es-MX')}</p></div></header><h3>Cliente: ${esc(c.cliente||'')}</h3><p>Teléfono: ${esc(c.tel||'')}</p><table><tr><th>Cant.</th><th>Descripción</th><th class=num>Precio unitario</th><th class=num>Importe</th></tr>${c.items.map(x=>`<tr><td>${x.cant}</td><td>${esc(x.nombre||x.producto)}</td><td class=num>${money(x.precio)}</td><td class=num>${money(x.cant*x.precio)}</td></tr>`).join('')}</table><div class=total><b>Total: ${money(c.total)}</b></div><p>Condiciones: ${esc(conf.notas||'Precios sujetos a vigencia indicada. Confirmar disponibilidad al aceptar la cotización.')}</p><p>Datos de pago: ${esc(conf.datosBancarios||'')}</p><div class=foot>Gracias por su preferencia.</div></body></html>`);w.document.close();w.print()}
