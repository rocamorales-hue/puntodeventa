<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f3028">
<title>POS Café Sierra Escondida</title>
<style>
/* ── SIERRA UI v2 · limpio, editorial, cafetería moderna ── */
:root{--bg:#f4f3ee;--card:#fff;--tx:#1d2822;--mu:#78807a;--ln:#e8e7df;--ac:#3f6b53;--ac2:#2f5440;--ok:#2f8056;--bad:#c0504a;--sb:#18271f;--r:20px;--sh:0 1px 2px rgba(24,39,31,.04),0 8px 28px rgba(24,39,31,.05);--soft:#edf2eb;--gold:#c8a05c;--ring:0 0 0 4px rgba(63,107,83,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:14px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d6d8cf;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#bfc4b9}
button{font:inherit;color:inherit;cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.2,1)}
input,select,textarea{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 15px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder,textarea::placeholder{color:#a7ada4}
input:focus,select:focus,textarea:focus{border-color:#86a68f;box-shadow:var(--ring)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* layout */
.app{display:grid;grid-template-columns:96px minmax(0,1fr);height:100%;min-height:0}
.side{background:linear-gradient(180deg,#1b2d23,#142019);display:flex;flex-direction:column;align-items:center;padding:20px 10px;gap:6px;overflow:auto}
.logo{font-size:26px;margin:0 0 22px;width:50px;height:50px;border-radius:17px;background:linear-gradient(145deg,#d4ad68,#b88a45);display:grid;place-items:center;box-shadow:0 8px 20px rgba(200,160,92,.28),inset 0 1px rgba(255,255,255,.35)}
.side button{width:76px;min-height:64px;background:transparent;border:0;border-radius:16px;padding:9px 3px;color:#9fb0a3;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;letter-spacing:.02em;position:relative}
.side button i{font-style:normal;font-size:20px;line-height:1.1;filter:grayscale(.35) opacity(.85)}
.side button:hover{background:rgba(255,255,255,.07);color:#fff}
.side button.on{background:rgba(255,255,255,.95);color:#1f3b2b;font-weight:750;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.side button.on i{filter:none}
.main{overflow:auto;padding:30px 34px 36px;min-width:0;scrollbar-gutter:stable;animation:up .35s both}
.main>h2{font-size:28px;letter-spacing:-.05em;font-weight:800;margin:0 0 6px;color:#1f2e25}
.main>h2:after{content:"";display:block;width:34px;height:3px;background:var(--gold);border-radius:5px;margin:12px 0 18px}

/* vender */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;height:100%;min-height:520px}
.cat{display:flex;flex-direction:column;min-height:0}
.top{display:flex;gap:10px;align-items:center}
.top input{height:50px;border-radius:16px;background:#fff;box-shadow:var(--sh);border-color:transparent;padding-left:18px}
.top input:focus{border-color:#86a68f}
.chips{display:flex;gap:8px;overflow:auto;padding:16px 0 18px;scrollbar-width:none}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:8px 16px;color:#5f6a61;font-size:12.5px;font-weight:650}
.chip:hover{border-color:#a8bba9;color:var(--ac);transform:translateY(-1px)}
.chip.on{background:var(--sb);color:#fff;border-color:var(--sb);box-shadow:0 5px 14px rgba(24,39,31,.22)}
.gridwrap{overflow:auto;flex:1;padding:3px 4px 90px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pr{background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:152px;box-shadow:var(--sh);animation:up .35s both}
.pr:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(24,39,31,.11);border-color:#d3dfd2}
.pr:active{transform:scale(.97)}
.pr .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:inset 0 1px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.08)}
.pr b{font-weight:650;font-size:13px;line-height:1.35;flex:1;color:#2f3b33}
.pr span{color:var(--ac);font-weight:800;font-size:16px;letter-spacing:-.03em}

/* ticket */
.cartp{background:var(--card);border:1px solid rgba(232,231,223,.8);border-radius:26px;display:flex;flex-direction:column;min-height:0;box-shadow:0 18px 50px rgba(24,39,31,.09);overflow:hidden}
.ch{padding:22px 22px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0efe8}
.ch h3{margin:0;font-size:17px;letter-spacing:-.03em;font-weight:750}
.cb{padding:16px 20px 10px;display:grid;gap:11px}
.cb input,.cb select{background:#f8f8f3;border-color:transparent}
.cb input:focus{background:#fff;border-color:#86a68f}
.seg{display:flex;background:#f0f1ea;border-radius:14px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-size:12px;font-weight:600;color:#6f796f;white-space:nowrap}
.seg .on{background:#fff;box-shadow:0 2px 8px rgba(24,39,31,.1);font-weight:750;color:var(--ac)}
.items{flex:1;overflow:auto;padding:6px 22px}
.it{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:15px 0;border-bottom:1px dashed #e6e5db;animation:up .25s both}
.it:last-child{border-bottom:0}
.it .nm{font-size:13px;font-weight:550;color:#343f37}
.it .sub{font-weight:800;text-align:right;color:#26352b;letter-spacing:-.02em}
.qty{display:flex;align-items:center;gap:5px}
.qty button{width:30px;height:30px;border-radius:10px;border:0;background:#f0f2ea;font-size:17px;line-height:1;color:#456650;font-weight:700}
.qty button:hover{background:var(--ac);color:#fff}
.qty b{min-width:26px;text-align:center;font-size:13px}
.qty input{width:84px;padding:6px 10px;margin-left:auto;text-align:right;border-radius:10px;background:#f8f8f3;border-color:transparent}
.foot{padding:18px 22px 22px;border-top:1px solid #eeede5;display:grid;gap:11px;background:linear-gradient(180deg,#fcfcf8,#f8f8f2)}
.tl{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tl b{font-size:30px;letter-spacing:-.05em;font-weight:800}

/* botones */
.p,.s{border-radius:14px;padding:13px 16px;border:0;font-weight:700}
.p{background:linear-gradient(180deg,#4a7a5f,var(--ac));color:#fff;box-shadow:0 6px 16px rgba(63,107,83,.26),inset 0 1px rgba(255,255,255,.18)}
.p:hover{background:linear-gradient(180deg,#427156,var(--ac2));box-shadow:0 10px 22px rgba(63,107,83,.32);transform:translateY(-1px)}
.p:active{transform:translateY(0) scale(.99)}
.s{background:#f3f4ed;border:1px solid transparent;color:#4d5b50}
.s:hover{background:#e8ece1;border-color:#d3dccd}
.w{width:100%}.row{display:flex;gap:10px}.row>*{flex:1}
.sm{padding:7px 12px;font-size:12px;border-radius:11px;font-weight:650}
.danger{color:var(--bad)}.danger:hover{background:#fbe9e6!important}

/* tarjetas, tags, kpis */
.card{background:var(--card);border:1px solid rgba(232,231,223,.7);border-radius:var(--r);padding:20px;box-shadow:var(--sh);animation:up .35s both}
.list{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:18px}
.list .card{display:grid;gap:6px;align-content:start}
.tag{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:750;background:#f9eed8;color:#8d6a2c;letter-spacing:.01em}
.tag.ok{background:#e2f1e6;color:#2f7048}.tag.x{background:#fbe6e2;color:#a8443a}
.mu{color:var(--mu);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin:18px 0}
.kpi{position:relative;overflow:hidden;padding-left:24px}
.kpi:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--gold),#9bb49b)}
.kpi b{display:block;font-size:27px;letter-spacing:-.05em;margin-top:6px;color:#243a2d;font-weight:800}
h2{margin:0 0 6px;font-size:22px;letter-spacing:-.04em}
h3{letter-spacing:-.03em}

/* tablas y formularios */
textarea{resize:vertical}
table{border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#7c857b;font-weight:700}
td,th{padding:12px;border-bottom:1px solid var(--ln)}
input[type=checkbox]{accent-color:var(--ac)}

/* modal y toast */
#modal{position:fixed;inset:0;background:rgba(18,30,23,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:30;padding:12px}
#modal .box{background:var(--card);border-radius:26px;padding:26px;width:100%;max-width:470px;display:grid;gap:15px;max-height:94vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.28);animation:up .3s both}
.big{font-size:44px;font-weight:800;text-align:center;letter-spacing:-.055em;color:var(--ac)}
.quick{display:flex;flex-wrap:wrap;gap:8px}.quick .s{padding:9px 13px;font-weight:650;border-radius:12px}
#chg{text-align:center;font-size:18px;font-weight:750;color:var(--ok);min-height:26px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1f3328;color:#fff;padding:12px 22px;border-radius:999px;z-index:50;display:none;box-shadow:0 12px 34px rgba(0,0,0,.24);font-size:13px;font-weight:650}
button.x{display:none}.bar{display:none}

/* reportes avanzados */
.report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.report-head h2{font-size:30px;margin:2px 0 6px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--ac);margin-bottom:7px}.report-filters{display:grid;grid-template-columns:1.25fr repeat(4,minmax(130px,1fr));gap:12px;align-items:end}.field{min-width:0;display:grid;gap:6px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:750;color:var(--mu)}.field input,.field select{min-width:0;padding:11px 12px;border-radius:12px;background:#fbfbf7}.report-kpis{margin-top:16px}.report-results{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:20px;margin-top:16px;box-shadow:var(--sh)}.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.results-head h3{margin:0;font-size:18px}.table-wrap{width:100%;overflow:auto;border:1px solid var(--ln);border-radius:13px}.report-table{width:100%;min-width:720px;border-collapse:separate;border-spacing:0}.report-table th{background:#f6f7f1;position:sticky;top:0;text-align:left;white-space:nowrap}.report-table td{font-size:12.5px;vertical-align:top}.report-table tr:last-child td{border-bottom:0}.report-table tbody tr:hover{background:#fafbf7}.report-table td:last-child,.report-table th:last-child{text-align:right}.report-table .empty{text-align:center!important;padding:28px;color:var(--mu)}.notice{margin-top:16px;background:#f9f2e5;border:1px solid #eee0c2;color:#775d2d;padding:12px 15px;border-radius:13px;font-size:12px}
/* responsive */
@media(min-width:1500px){.main{padding:36px 46px}.pos{grid-template-columns:minmax(0,1fr) 410px}.g{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media(max-width:1100px){.report-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:22px}.pos{grid-template-columns:minmax(0,1fr)}.cartp{position:fixed;inset:12px;border-radius:26px;z-index:20;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:calc(100% - 24px)}.cartp.open{transform:none}button.x{display:inline-block}.bar{display:flex;position:fixed;left:18px;right:18px;bottom:18px;z-index:10;background:linear-gradient(180deg,#223a2c,var(--sb));color:#fff;border:0;border-radius:18px;padding:17px 20px;justify-content:space-between;font-weight:750;box-shadow:0 14px 34px rgba(0,0,0,.25)}}
@media(max-width:700px){.report-head{flex-direction:column}.report-head .p{width:100%}.report-filters{grid-template-columns:1fr}.report-results{padding:13px}.results-head{align-items:flex-start;flex-direction:column}.app{grid-template-columns:1fr;grid-template-rows:1fr 70px}.side{order:2;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;border-top:1px solid rgba(255,255,255,.07)}.logo{display:none}.side button{width:auto;flex:1;min-height:54px;padding:5px 0;font-size:9px;border-radius:13px}.side button i{font-size:19px}.main{padding:20px 14px 100px}.main>h2{font-size:24px}.bar{bottom:82px;left:12px;right:12px}.g{grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:10px}.pr{min-height:134px;padding:13px;border-radius:17px}.pr .av{width:38px;height:38px;border-radius:12px}.list{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:15px 15px 15px 20px}.kpi b{font-size:21px}.cartp{padding-bottom:env(safe-area-inset-bottom)}.ch{padding:18px}.cb{padding:12px 16px}.items{padding:6px 16px}.foot{padding:14px 16px 18px}.card{padding:16px}.big{font-size:38px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="app"><nav class="side" id="nav"></nav><main class="main" id="app"><p class="mu">Cargando…</p></main></div>
<div id="modal" onclick="if(event.target==this)closeM()"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script>
const URL_API='https://script.google.com/macros/s/AKfycbyZsbFkMYhcfYQ8mk9Ca5ani7by_i-cFpplgzcDJyaGlj0SZmC2AdS18WiG1ZdCzZBj/exec';
const $=s=>document.querySelector(s),money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fd=t=>new Date(t).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
dkey=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'#c0392b':'';t.style.color=e?'#fff':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
let KEY='';try{KEY=localStorage.getItem('pos_key')||''}catch(e){}
async function api(f,...a){try{
 if(window.google&&google.script&&google.script.run)return await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[f](...a));
 if(!KEY){KEY=prompt('Clave del POS')||'';try{localStorage.setItem('pos_key',KEY)}catch(e){}}
 const r=await(await fetch(URL_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:f,args:a,key:KEY})})).json();
 if(!r.ok){if(/Clave/.test(r.error)){KEY='';try{localStorage.removeItem('pos_key')}catch(e){}}throw new Error(r.error)}return r.data
}catch(e){toast(e.message||'Error de conexión',1);throw e}}

let S={prods:[],clients:[],ventas:[],cots:[]},cart=[],ed=null,cot=null,cat='Todas',CATS=[],view='vender',TK=[],X={cli:'',nota:''},tipo='Aquí',pm='Efectivo',fe='Pendiente';
const NAV=[['vender','🧾','Vender'],['ventas','📋','Ventas'],['cotizaciones','📝','Cotiz.'],['clientes','👥','Clientes'],['productos','📦','Productos'],['corte','📊','Corte'],['reportes','📈','Reportes'],['configuracion','⚙️','Config.']];
const tot=()=>cart.reduce((s,i)=>s+i.cant*i.precio,0),cnt=()=>cart.reduce((s,i)=>s+i.cant,0);
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 45% 42%)`};
function tickets(){const m={};S.ventas.forEach(v=>{const t=m[v.folio]=m[v.folio]||{folio:v.folio,fecha:v.fecha,cliente:v.cliente,estado:v.estado,metodo:v.metodo,tipo:v.tipo,nota:v.nota,items:[],total:0};t.items.push(v);t.total+=v.total});return Object.values(m).sort((a,b)=>b.fecha-a.fecha)}
async function load(){S=await api('getData');go()}
function go(){$('#nav').innerHTML='<div class=logo>☕</div>'+NAV.map(n=>`<button class="${n[0]==view?'on':''}" onclick="view='${n[0]}';go()"><i>${n[1]}</i>${n[2]}</button>`).join('');
 $('#app').innerHTML=V[view]();if(view=='vender'){chipsR();grid();cartR()}if(view=='ventas')ventasR();if(view=='corte')corteR();if(view=='reportes')reportesR();if(view=='configuracion')configR()}
function modal(h){$('#mbox').innerHTML=h;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}

const V={
vender(){return `<div class=pos><section class=cat><div class=top><input id=q placeholder="🔍  Buscar producto…" oninput=grid()></div><div class=chips id=chips></div><div class=gridwrap><div class=g id=grid></div></div></section>
<aside class=cartp id=cartp><div class=ch><h3 id=ctitle></h3><div><button class="s sm" onclick="clearCart()">Vaciar</button> <button class="s sm x" onclick="cartToggle(0)">✕ Cerrar</button></div></div>
<div class=cb><input id=cli list=cl placeholder="👤 Cliente (escribe o elige)" value="${esc(X.cli)}" oninput="X.cli=this.value"><datalist id=cl>${S.clients.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist>
<div class=seg>${['Aquí','Para llevar','Domicilio'].map(t=>`<button class="${t==tipo?'on':''}" onclick="tipo='${t}';document.querySelectorAll('#cartp .seg button').forEach(b=>b.classList.toggle('on',b.textContent=='${t}'))">${t}</button>`).join('')}</div>
<input id=nota placeholder="📝 Nota (opcional)" value="${esc(X.nota)}" oninput="X.nota=this.value"></div>
<div class=items id=items></div>
<div class=foot><div class=tl><span class=mu id=ccount></span><b id=tot></b></div><div class=row><button class=p onclick=payOpen()>💵 Cobrar</button><button class=s onclick="guardar('Pendiente')">Dejar pendiente</button></div><button class="s w" onclick=cotizar()>Guardar como cotización</button></div></aside>
<button class=bar onclick="cartToggle(1)"><span id=bcount></span><span id=btot></span></button></div>`},
ventas(){return `<h2>Ventas</h2><div class=top><input id=fq placeholder="🔍 Buscar cliente, folio o producto" oninput=ventasR()></div><div class=chips>${['Pendiente','Pagado','Todos'].map(e=>`<button class="chip ${e==fe?'on':''}" onclick="fe='${e}';go()">${e}</button>`).join('')}</div><div class=list id=vl></div>`},
cotizaciones(){return `<h2>Cotizaciones</h2><div class=list>${[...S.cots].map((c,i)=>[c,i]).reverse().map(([c,i])=>`<div class=card><div class=tl><b>${esc(c.folio)}</b><span class="tag ${c.estado=='Convertida'?'ok':c.estado=='Cancelada'?'x':''}">${esc(c.estado)}</span></div><div>${esc(c.cliente)}</div><div class=mu>${fd(c.fecha)} · vence ${new Date(c.vigencia).toLocaleDateString('es-MX')}</div><div class=mu>${c.items.map(x=>x.cant+'× '+esc(x.nombre)).join(', ')}</div><div class=tl style="margin-top:8px"><b>${money(c.total)}</b><span><button class="s sm" onclick="cargaCot(${i})">Cargar</button> <button class="s sm" onclick="waCot(${i})">WhatsApp</button> <button class="s sm" onclick="printQuote(${i})">Imprimir carta</button> <button class="s sm danger" onclick="cancCot(${i})">✕</button></span></div></div>`).join('')||'<p class=mu>Sin cotizaciones</p>'}</div>`},
clientes(){const d={};tickets().filter(t=>t.estado=='Pendiente').forEach(t=>d[t.cliente]=(d[t.cliente]||0)+t.total);
return `<h2>Clientes</h2><div class=card><div class=row><input id=cn placeholder=Nombre><input id=ct placeholder=Teléfono inputmode=tel><input id=ce placeholder=Email></div><button class="p" style="margin-top:8px" onclick=addCli()>＋ Agregar cliente</button></div>
<div class=top style="margin-top:12px"><input placeholder="🔍 Buscar…" oninput="filt(this)"></div><div class=list>${S.clients.map(c=>`<div class="card f"><div class=tl><b>${esc(c.nombre)}</b>${d[c.nombre]?`<span class=tag>Debe ${money(d[c.nombre])}</span>`:''}</div><div class=mu>${esc(c.tel)||'Sin teléfono'}</div></div>`).join('')}</div>`},

  title='Reporte por método de cobro';const m={};paid.forEach(t=>{if(!match(t.metodo)&&!match(t.cliente)&&!match(t.folio))return;const n=t.metodo||'Sin especificar';const x=m[n]||(m[n]={metodo:n,operaciones:0,total:0});x.operaciones++;x.total+=t.total});const vals=Object.values(m).sort((a,b)=>b.total-a.total);headers=['Método de cobro','Operaciones','Importe cobrado','Participación'];rows=vals.map(x=>[x.metodo,x.operaciones,x.total,collected?((x.total/collected)*100).toFixed(1)+'%':'0%']);extra=kpis([['Cobros registrados',cash(sum(vals,x=>x.total)),'Solo ventas pagadas'],['Métodos utilizados',String(vals.length),'En el periodo'],['Ventas pendientes',cash(debt),'No se consideran cobros']]);
 }else if(tipo==='ventas'){
  title='Detalle de ventas';const vals=all.filter(t=>match([t.folio,t.cliente,t.metodo,t.estado,t.tipo,t.items.map(x=>x.producto||x.nombre).join(' ')].join(' '))).sort((a,b)=>(Number(b.fecha)||0)-(Number(a.fecha)||0));headers=['Folio','Fecha','Cliente','Productos','Estado','Método de cobro','Tipo','Total'];rows=vals.map(t=>[t.folio,fd(t.fecha),t.cliente||'Mostrador',t.items.map(x=>(x.cant||0)+'× '+(x.producto||x.nombre)).join(', '),t.estado,t.metodo||'—',t.tipo||'—',t.total]);extra=kpis([['Tickets',String(vals.length),'Con los filtros actuales'],['Importe total',cash(sum(vals,x=>x.total)),'Suma de tickets'],['Cobrado',cash(sum(vals.filter(t=>t.estado==='Pagado'),x=>x.total)),'Tickets pagados']]);
 }else if(tipo==='categoria'){
  title='Ventas por categoría';const cats={};all.forEach(t=>t.items.forEach(i=>{const p=S.prods.find(p=>p.nombre===(i.producto||i.nombre)),c=p?.cat||'Sin categoría';if(!match(c)&&!match(i.producto||i.nombre))return;const x=cats[c]||(cats[c]={categoria:c,unidades:0,importe:0});x.unidades+=Number(i.cant)||0;x.importe+=(Number(i.cant)||0)*(Number(i.precio)||0)}));const vals=Object.values(cats).sort((a,b)=>b.importe-a.importe);headers=['Categoría','Unidades vendidas','Importe vendido'];rows=vals.map(x=>[x.categoria,x.unidades,x.importe]);extra=kpis([['Categorías',String(vals.length),'Con ventas'],['Unidades',String(sum(vals,x=>x.unidades)),'Total unidades'],['Ingresos',cash(sum(vals,x=>x.importe)),'Por productos vendidos']]);
 }else if(tipo==='servicio'){
  title='Ventas por tipo de servicio';const m={};all.forEach(t=>{const n=t.tipo||'Sin especificar';if(!match(n))return;const x=m[n]||(m[n]={tipo:n,tickets:0,total:0,cobrado:0,pendiente:0});x.tickets++;x.total+=t.total;if(t.estado==='Pagado')x.cobrado+=t.total;else x.pendiente+=t.total});const vals=Object.values(m).sort((a,b)=>b.total-a.total);headers=['Tipo de servicio','Tickets','Ventas','Cobrado','Pendiente'];rows=vals.map(x=>[x.tipo,x.tickets,x.total,x.cobrado,x.pendiente]);extra=kpis([['Tipos de servicio',String(vals.length),'Con movimientos'],['Ventas',cash(sum(vals,x=>x.total)),'Total del periodo']]);
 }else if(tipo==='utilidad'){
  title='Utilidad bruta estimada';const m={};all.forEach(t=>t.items.forEach(i=>{const n=i.producto||i.nombre||'Sin nombre';if(!match(n)&&!match(t.cliente))return;const x=m[n]||(m[n]={producto:n,unidades:0,venta:0,costo:0});x.unidades+=Number(i.cant)||0;x.venta+=(Number(i.cant)||0)*(Number(i.precio)||0);x.costo+=(Number(i.cant)||0)*(Number(i.costo)||0)}));const vals=Object.values(m).map(x=>({...x,utilidad:x.venta-x.costo,margen:x.venta?(x.venta-x.costo)/x.venta*100:0})).sort((a,b)=>b.utilidad-a.utilidad);headers=['Producto','Unidades','Venta estimada','Costo estimado','Utilidad bruta','Margen'];rows=vals.map(x=>[x.producto,x.unidades,x.venta,x.costo,x.utilidad,x.margen.toFixed(1)+'%']);extra=`<div class="notice">La utilidad se estima con el costo guardado en cada artículo vendido. No equivale a utilidad neta y puede ser incompleta si faltan costos.</div>`+kpis([['Venta estimada',cash(sum(vals,x=>x.venta)),'Productos incluidos'],['Costo estimado',cash(sum(vals,x=>x.costo)),'Costo registrado'],['Utilidad bruta',cash(sum(vals,x=>x.utilidad)),'Antes de gastos operativos']]);
 }else if(tipo==='cotizaciones'){
  title='Reporte de cotizaciones';const vals=(S.cots||[]).filter(c=>{const d=dkey(Number(c.fecha)||new Date(c.fecha).getTime());return d>=d1&&d<=d2&&match([c.folio,c.cliente,c.estado].join(' '))}).sort((a,b)=>(Number(b.fecha)||0)-(Number(a.fecha)||0));headers=['Folio','Fecha','Cliente','Estado','Vigencia','Importe'];rows=vals.map(c=>[c.folio,fd(c.fecha),c.cliente||'—',c.estado||'—',c.vigencia?new Date(c.vigencia).toLocaleDateString('es-MX'):'—',Number(c.total)||0]);extra=kpis([['Cotizaciones',String(vals.length),'En el periodo'],['Importe cotizado',cash(sum(vals,c=>c.total)),'No equivale a venta'],['Convertidas',String(vals.filter(c=>c.estado==='Convertida').length),'Estado registrado']]);
 }
 REP_TITLE=title;REP_HEADERS=headers;REP_ROWS=rows;
 el.innerHTML=`${extra}<div class="report-results"><div class="results-head"><div><h3>${esc(title)}</h3><p class=mu>${rows.length} registros · ${esc(d1)} a ${esc(d2)}</p></div><button class="s sm" onclick="imprimirReporte()">Imprimir / PDF</button></div>${table(headers,rows)}</div>`;
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportarReporte(){if(!REP_HEADERS.length)reportesR();const rows=[[REP_TITLE],REP_HEADERS,...REP_ROWS];const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='reporte-'+(REP_TITLE||'pos').toLocaleLowerCase('es-MX').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function imprimirReporte(){const w=window.open('','_blank');if(!w)return toast('Permite las ventanas emergentes para imprimir',1);w.document.write(`<!doctype html><html lang="es"><meta charset="utf-8"><title>${esc(REP_TITLE)}</title><style>body{font:12px Arial;margin:24px;color:#222}h1{font-size:22px}p{color:#666}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{background:#eef2ec}tr{page-break-inside:avoid}@media print{button{display:none}}</style><h1>Café Sierra Escondida — ${esc(REP_TITLE)}</h1><p>Generado: ${new Date().toLocaleString('es-MX')} · Periodo: ${esc($('#rd1')?.value||'')} a ${esc($('#rd2')?.value||'')}</p><table><thead><tr>${REP_HEADERS.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${REP_ROWS.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}

function exportarReporte(){const rows=[['Folio','Fecha','Cliente','Estado','Método','Total'],...tickets().map(t=>[t.folio,fd(t.fecha),t.cliente,t.estado,t.metodo,t.total])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='reporte-pos.csv';a.click();URL.revokeObjectURL(a.href)}
