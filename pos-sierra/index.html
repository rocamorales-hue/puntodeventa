<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D46">
<meta name="description" content="Punto de venta de Café Sierra Escondida">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS Sierra">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>POS Café Sierra Escondida</title>
<style>
/* ===== Tokens (Tostado & Bosque) ===== */
:root{--bg:#f3f3ef;--surface:#fff;--ink:#1c2620;--mute:#667068;--line:#e1e2da;--forest:#1f3028;--sage:#e3ebe2;--accent:#a35d17;--accent-d:#8a4d10;--on-accent:#fff;--ok:#2f8056;--bad:#b9473d;--r:14px;--tap:46px;--shadow:0 6px 24px rgba(28,38,32,.07);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#131a16;--surface:#1b241f;--ink:#e9eee9;--mute:#9aa59d;--line:#2a352e;--sage:#25332b;--accent:#d08a43;--accent-d:#e09d57;--on-accent:#1a1209;--ok:#58b583;--bad:#e1796f;--shadow:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{width:100%;min-height:var(--tap);padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
h2{margin:0;font-size:18px}
.mu{color:var(--mute);font-size:13px}

/* ===== Botones ===== */
.btn{min-height:var(--tap);padding:0 16px;border-radius:12px;font-weight:650;background:var(--sage);color:var(--ink);border:1px solid transparent}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100%}
.rail{background:var(--forest);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
.rail .logo{font-size:26px;margin-bottom:14px}
.rail button{width:68px;min-height:62px;border-radius:14px;color:#b9c7bb;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rail button i{font-style:normal;font-size:20px}
.rail button:hover{background:rgba(255,255,255,.07);color:#fff}
.rail button[aria-current=page]{background:#e3ebe2;color:#1f3028;font-weight:700}
.main{overflow:auto;padding:22px 26px;min-width:0}
.menu{display:grid;gap:10px;max-width:420px}
.menu .btn{text-align:left;background:var(--surface);border-color:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* ===== Vender ===== */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;height:100%;min-height:0}
.catalog{display:flex;flex-direction:column;min-height:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.chip{white-space:nowrap;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-weight:600}
.chip[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:#fff}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;padding:2px 2px 90px}
.prod{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,transform .15s}
.prod:hover{border-color:var(--accent)}
.prod .add{display:flex;flex-direction:column;gap:10px;width:100%;min-height:128px;padding:14px;text-align:left}
.prod .add:active{transform:scale(.98)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}
.prod b{font-weight:600;line-height:1.3;flex:1}
.prod .pr{font-weight:750;color:var(--accent)}
.prod .fav{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:10px;color:var(--mute);font-size:18px}
.prod .fav[aria-pressed=true]{color:var(--accent)}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.t-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.t-fields{display:grid;gap:10px;padding:14px 18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sage);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.items{flex:1;overflow:auto;padding:0 18px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:600}
.line .sub{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;background:var(--sage);font-size:18px}
.qty b{min-width:26px;text-align:center}
.price-in{width:100px;min-height:40px;text-align:right}
.empty{margin:28px 0;text-align:center;color:var(--mute)}
.t-foot{padding:14px 18px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:30px;letter-spacing:-.03em}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{padding:0 6px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.totalbar,.t-close{display:none}

/* ===== Modal y toast ===== */
#modal{position:fixed;inset:0;background:rgba(10,18,13,.5);display:none;align-items:center;justify-content:center;padding:12px;z-index:30}
#modal .box{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:440px;display:grid;gap:14px;max-height:94vh;overflow:auto}
.big{font-size:38px;font-weight:800;color:var(--accent);text-align:center}
.amounts{display:flex;flex-wrap:wrap;gap:8px}
#change{text-align:center;font-weight:700;min-height:24px;color:var(--ok)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 20px;border-radius:999px;z-index:50;font-weight:600;max-width:92vw}
#toast.err{background:var(--bad)}
#toast[hidden]{display:none}

/* ===== Responsive ===== */
@media(max-width:1000px){
 .pos{grid-template-columns:minmax(0,1fr)}
 .ticket{position:fixed;inset:auto 0 0 0;max-height:92%;border-radius:22px 22px 0 0;z-index:20;transform:translateY(105%);transition:transform .25s}
 .ticket.open{transform:none}
 .t-close{display:inline-flex}
 .totalbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:10;min-height:54px;align-items:center;justify-content:space-between;padding:0 18px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:750;box-shadow:var(--shadow)}
}
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 .rail{order:2;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
 .rail .logo{display:none}
 .rail button{flex:1;width:auto;min-height:58px;font-size:12px}
 .main{padding:16px 14px 150px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Listas, etiquetas y formularios (etapa 2) ===== */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:6px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#f6ead4;color:#7d5a1f}
.tag.ok{background:#e1efe4;color:#2f6e48}
@media(prefers-color-scheme:dark){.tag{background:#3a2f1c;color:#e3b872}.tag.ok{background:#1f3a2b;color:#7fd0a1}}
.amt{font-size:20px}
.danger{color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

/* ===== Indicadores (etapa 3) ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.kpi b{display:block;font-size:24px;margin-top:6px;letter-spacing:-.02em}

/* ===== Barra de estado y reportes (etapa 4) ===== */
.bar{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:10px;border-radius:6px;background:var(--accent);opacity:.85}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{text-align:left;color:var(--mute);font-weight:600}
.rtable td,.rtable th{padding:7px 6px;border-bottom:1px solid var(--line)}
.rtable .n{text-align:right}
.rfilters{display:grid;gap:10px;margin:12px 0}
.rfilters .row2{grid-template-columns:1fr 1fr}
.up{color:var(--ok)}.dn{color:var(--bad)}

/* ===== Existencias en el catálogo (etapa 5) ===== */
.stk{font-size:11px;font-weight:650;color:var(--mute)}
.stk.low{color:var(--accent)}
.stk.out{color:var(--bad)}

/* ===== Pago dividido (etapa 6) ===== */
.row2.r3{grid-template-columns:repeat(3,1fr)}
.r3 .btn{font-size:12px;padding:0 4px}
.splitrow{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center}

/* ===== Aviso "Procesando…" (etapa 7) ===== */
#busy{position:fixed;inset:0;z-index:45;background:rgba(10,18,13,.28);display:flex;align-items:center;justify-content:center}
#busy[hidden]{display:none}
.busybox{display:flex;gap:12px;align-items:center;background:var(--surface);padding:14px 22px;border-radius:999px;box-shadow:var(--shadow);font-weight:650}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== Clientes (etapa 8) ===== */
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:170px}
.chead{display:flex;gap:12px;align-items:center}
.cav{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.cli{cursor:pointer;transition:border-color .15s}.cli:hover{border-color:var(--accent)}
.cact{display:flex;gap:8px;flex-wrap:wrap}
.chead b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Productos (etapa 9) ===== */
.fl{display:grid;gap:4px;font-size:12px;font-weight:650;color:var(--mute)}
.fl input{font-weight:400;color:var(--ink)}
.tag.x{background:#f6dcd8;color:#8f332a}
@media(prefers-color-scheme:dark){.tag.x{background:#4a2420;color:#f0a49c}}

/* ===== Vender: más peso al ticket, catálogo en lista, íconos de línea (etapa 10) ===== */
.pos{grid-template-columns:minmax(0,1fr) minmax(430px,42%);gap:22px}
.rail .logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#e3ebe2;font-size:0;margin-bottom:16px}
.rail .logo svg{width:24px;height:24px}
.rail button i{display:grid;place-items:center;font-size:0}
.rail button svg{width:22px;height:22px}
.rail button span{font-weight:600;letter-spacing:.01em}
.menu .btn{display:flex;align-items:center;gap:12px}.menu .btn svg{width:20px;height:20px;color:var(--accent);flex:none}
.catbar{display:flex;gap:10px;align-items:center}.catbar input{flex:1;min-height:50px;font-size:16px}
.vmode{display:flex;background:var(--sage);border-radius:12px;padding:3px;gap:3px}
.vmode button{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.vmode button svg{width:19px;height:19px}
.vmode button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.grid.rows{display:flex;flex-direction:column;gap:6px}
.prow{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prow:hover{border-color:var(--accent)}
.prow .add{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 52px 8px 14px;text-align:left}
.prow .add:active{background:var(--sage);border-radius:12px}
.prow .pn{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .pn b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn small{color:var(--mute);font-size:12px}
.prow .pr{font-weight:750;font-size:16px;color:var(--accent)}
.prow .fav{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;color:var(--mute);font-size:18px}
.prow .fav[aria-pressed=true]{color:var(--accent)}
.qb{background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:750;border-radius:999px;padding:2px 9px}
.prod .qb{position:absolute;top:10px;left:10px}
.t-head h2{font-size:20px}
.t-fields{gap:8px;padding:12px 18px}
.seg button{min-height:38px}
.linkbtn{justify-self:start;color:var(--accent);font-weight:650;min-height:30px}
.items{padding:0 20px}
.line{padding:14px 0;gap:8px 12px}
.line .nm{font-size:16px;font-weight:650}.line .sub{font-size:17px}
.qty button{width:44px;height:44px;font-size:20px}.qty b{min-width:32px;font-size:16px}
.line.flash{animation:flash 1s ease-out}
@keyframes flash{from{background:var(--sage)}to{background:transparent}}
.total b{font-size:38px}
.t-foot{gap:10px}
.quick .btn{min-height:50px;font-size:14px}
@media(max-width:1000px){.pos{grid-template-columns:minmax(0,1fr)}}

/* ===== Ticket compacto, estado flotante y artículo libre (etapa 11) ===== */
.t-head{padding:12px 16px}.t-head h2{font-size:18px}
.t-fields{padding:8px 16px 6px;gap:6px}
.t-fields input{min-height:42px}
#det{display:grid}
.items{flex:1;min-height:140px;padding:0 16px}
.t-foot{padding:10px 16px 14px;gap:8px}
.t-foot .total b{font-size:34px}
.quick .btn{min-height:48px}
.linkbtn[hidden]{display:none}
#dline{justify-self:end;color:var(--mute);font-weight:600;font-size:13px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:650;min-height:34px;display:flex;align-items:center;justify-content:space-between;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"▾";transition:transform .15s}
details.more[open] summary::after{transform:rotate(180deg)}
details.more>*:not(summary){margin-top:8px}
@media(max-height:780px){.t-head{padding:8px 14px}.t-head h2{font-size:16px}.line{padding:9px 0}.qty button{width:38px;height:38px}.t-foot .total b{font-size:30px}.quick .btn{min-height:44px}.t-foot{padding:8px 14px 10px;gap:6px}}
.catbar .libre{min-height:50px;white-space:nowrap}
/* Indicador de estado flotante (semitransparente) */
.pill{position:fixed;left:98px;bottom:12px;z-index:25;display:flex;align-items:center;gap:8px;min-height:26px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 65%,transparent);backdrop-filter:blur(6px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:12px;font-weight:650;color:var(--mute);opacity:.7}
.pill:hover{opacity:1}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.pill .lbl{display:none}.pill:not([data-s=ok]) .lbl{display:inline}
.pill[data-s=busy] .dot{background:#d99a2b;animation:pulse 1s ease-in-out infinite}
.pill[data-s=sync] .dot{background:#3b82c4;animation:pulse 1.3s ease-in-out infinite}
.pill[data-s=err] .dot{background:#e0662a}
.pill[data-s=off] .dot{background:var(--bad)}
.pill:not([data-s=ok]){opacity:.92}
@keyframes pulse{50%{transform:scale(1.55);opacity:.45}}
@media(max-width:760px){.pill{left:50%;transform:translateX(-50%);bottom:auto;top:6px}}

/* ===== Corrección: lo que lleva "hidden" debe ocultarse siempre (etapa 12) ===== */
[hidden]{display:none!important}
.qty-in{width:66px;min-height:44px;padding:0 4px;text-align:center;font-weight:700;font-size:16px;border-radius:10px;-moz-appearance:textfield;appearance:textfield}
.qty-in::-webkit-inner-spin-button,.qty-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@media(max-height:780px){.qty-in{min-height:38px}}

/* ===== Caja (etapa 9) ===== */
.cj-hero{display:grid;gap:6px;margin-top:12px}
.cj-big{font-size:42px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1.1}
.cj-brk{display:grid;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.cj-brk .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:750}
.cj-warn{background:#f6ead4;color:#7d5a1f;border-radius:12px;padding:10px 14px;font-weight:600}
.cj-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.cj-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.cj-row:last-child{border-bottom:0}
.cj-row.clic,.cj-c{cursor:pointer}
.cj-row.void{opacity:.55;text-decoration:line-through}
.cj-row.void .btn{display:none}
.cj-den{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cj-den label{display:grid;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
.cj-den input{min-height:40px;padding:6px 10px}
.cj-f{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
.cj-chk{display:flex;gap:10px;align-items:center;font-size:14px}
.cj-chk input{width:20px;min-height:20px}
.cj-dif{text-align:center;font-weight:750;min-height:24px;margin:6px 0}
@media(prefers-color-scheme:dark){.cj-warn{background:#3a2f1c;color:#e3b872}}

/* ===== Tema v1.18 · Sierra clara ===== */
:root{--bg:#F7F4EE;--surface:#fff;--ink:#1F2A24;--mute:#7A8379;--line:#E9E3D8;--forest:#2F5D46;--sage:#EFEBE2;--accent:#2F5D46;--accent-d:#264d3a;--on-accent:#fff;--amber:#E08A1E;--amber-bg:#FCEFD9;--amber-ink:#8A5208;--ok:#1E5A3A;--ok-bg:#DDEFE3;--bad:#B4443A;--bad-bg:#F8E1DD;--r:16px;--shadow:0 8px 28px rgba(47,93,70,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#111713;--surface:#1A221D;--ink:#EAEFE9;--mute:#97A39A;--line:#2A342D;--forest:#13201A;--sage:#232E27;--accent:#5FB68A;--accent-d:#74c79b;--on-accent:#0B1A12;--amber:#E9A04A;--amber-bg:#3A2D18;--amber-ink:#EBC183;--ok:#7FD0A1;--ok-bg:#1E3A2B;--bad:#E27F74;--bad-bg:#3E2320;--shadow:0 8px 28px rgba(0,0,0,.4)}}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
h2{font-size:20px;letter-spacing:-.02em}
input,select{border-radius:12px;background:var(--surface)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.card,.prod,.ticket{border-color:var(--line);box-shadow:0 1px 2px rgba(31,42,36,.04)}
.ticket{border-radius:22px;box-shadow:var(--shadow)}
.btn{border-radius:14px;font-weight:650}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:var(--surface)}
.rail{background:var(--forest);border-radius:0 24px 24px 0}

.rail button[aria-current=page]{background:#fff;color:#2F5D46;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.main{padding:26px 30px}
.chip{background:var(--surface);border-color:var(--line);border-radius:999px}

.av{border-radius:14px;width:42px;height:42px;font-size:17px}

.qb{background:var(--amber);color:#2b1a04}

.qty button{background:var(--sage);border-radius:12px}
.total b,.t-foot .total b{font-size:40px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}

.linkbtn,details.more summary{color:var(--accent)}

.cj-big{color:var(--ink);font-size:46px}

.big{color:var(--ink)}

.cav.sm{width:32px;height:32px;border-radius:10px;font-size:13px}

async function load() {

/* Indicador flotante: verde = activo, ámbar = procesando, azul = actualizando, naranja = error, rojo = sin conexión */
function renderStatus() {
  const el = $('#sb'); if (!el) return;
  const off = !net.ok || !navigator.onLine;
  const st = off ? 'off' : Date.now() - net.err < 4000 ? 'err' : busyN > 0 ? 'busy' : net.loading ? 'sync' : 'ok';
  const lbl = { off: 'Sin conexión', err: 'Error', busy: 'Procesando…', sync: 'Actualizando…', ok: 'Activo' }[st];
  const k = t => new Date(t - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10), hoy = k(Date.now());
  const T = typeof tickets === 'function' ? tickets() : [];
  const h = T.filter(t => k(t.fecha) === hoy), pend = T.filter(t => t.estado !== 'Pagado');
  const tip = 'POS v' + VERSION + ' · ' + lbl + (net.last ? ' · actualizado ' + net.last.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '') +
    (T.length ? ' · hoy ' + money(h.reduce((s, t) => s + t.total, 0)) + ' · ' + pend.length + ' por cobrar' : '') + ' (toca para actualizar)';
  el.dataset.s = st; el.title = tip; el.setAttribute('aria-label', tip);
  el.innerHTML = '<span class="dot"></span><span class="lbl">' + lbl + '</span>';
}
$('#sb').addEventListener('click', () => { if (!busyN) load(); });

        <div class="row2"><label class="fl">Meta: cada N compras${num('g_mc', c.meta.cada, '1')}</label><label class="fl">Bono por meta ($)${num('g_mb', c.meta.bono)}</label></div></div>
      <div class="cbsec"><h3>4 · Recompensas manuales</h3><label class="fl">Una por línea: nombre = monto (0 = lo escribes al darla)<textarea id="g_man" rows="4">${c.manuales.map(m => `${m.nombre} = ${m.monto}`).join('\n')}</textarea></label></div>
      <div class="cbsec"><h3>Categorías que NO generan cashback</h3><div class="chkgrid">${cats.map(k => `<label class="chk"><input type="checkbox" data-ex="${esc(k)}" ${c.excluirCats.includes(k) ? 'checked' : ''}> ${esc(k)}</label>`).join('')}</div></div>
      <button class="btn primary" id="gok">Guardar reglas</button><button class="btn ghost" id="gno">Cancelar</button>`);

    $('#gok').onclick = async () => {
      const v = id => +$(id).value || 0;
      const niveles = $('#g_nl').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0]).map(p => ({ nombre: p[0], min: +String(p[1] || 0).replace(/[^\d.]/g, '') || 0, pct: +String(p[2] || 0).replace(/[^\d.]/g, '') || 0 }));
      const manuales = $('#g_man').value.split('\n').map(l => { const i = l.lastIndexOf('='); return i < 0 ? { nombre: l.trim(), monto: 0 } : { nombre: l.slice(0, i).trim(), monto: +l.slice(i + 1).replace(/[^\d.]/g, '') || 0 }; }).filter(m => m.nombre);
      const o = { activo: $('#g_on').checked, auto: $('#g_auto').checked, pct: v('#g_pct'), minTicket: v('#g_min'), tope: v('#g_tope'), vigenciaDias: v('#g_vig'), inicio: $('#g_ini').value ? new Date($('#g_ini').value + 'T00:00:00').getTime() : 0, usarNiveles: $('#g_niv').checked, niveles, bienvenida: v('#g_bien'), ticketGrande: { min: v('#g_tgm'), bono: v('#g_tgb') }, meta: { cada: v('#g_mc'), bono: v('#g_mb') }, manuales, excluirCats: [...document.querySelectorAll('#mbox [data-ex]')].filter(x => x.checked).map(x => x.dataset.ex) };
      if (o.pct > 100) return toast('El porcentaje no puede pasar de 100.', true);
      await api('saveCashbackCfg', o); closeM(); toast('Reglas de cashback guardadas'); load();
    };
  }

  /* ---------- Bloque para la ficha del cliente ---------- */
  function block(n) {
    const c = cfg(), o = todos()[up(n)], e = enr(n); if (!c.activo && !o && !e) return '';
    if (!activo(n) && !o) return `<div class="card cbblock"><div class="tl"><span class="mu">Cashback · no activado</span><button class="btn sm primary" data-cb="activar" data-n="${esc(n)}">Activar cashback</button></div></div>`;

      <div class="cact">${!activo(n) ? `<button class="btn sm primary" data-cb="activar" data-n="${esc(n)}">${e ? 'Reactivar' : 'Activar'}</button>` : ''}<button class="btn sm ${activo(n) ? 'primary' : ''}" data-cb="pone" data-n="${esc(n)}">Poner</button>${s > 0.004 ? `<button class="btn sm" data-cb="canje" data-n="${esc(n)}">Canjear</button><button class="btn sm ghost" data-cb="quita" data-n="${esc(n)}">Quitar</button><button class="btn sm ghost" data-cb="wa" data-n="${esc(n)}">WhatsApp</button>` : ''}<button class="btn sm ghost" data-cb="hist" data-n="${esc(n)}">Historial</button></div></div>`;

})();
/* ===== WhatsApp: mensajes ya escritos (ticket, saldo, cashback, libre) que se abren en el chat del cliente ===== */
(() => {
  const up = s => String(s || '').trim().toUpperCase();
  const KEY = 'wa_plantillas_v1';
  const DEF = {
    ticket: 'Hola {cliente} ☕\nGracias por tu compra en {negocio}.\n\nTicket {folio} · {fecha}\n{detalle}\nTotal: {total}\n{estado}\n{cashback}\n\n¡Te esperamos pronto!',
    saldo: 'Hola {cliente}, te escribimos de {negocio}. Tienes un saldo pendiente de {saldo}.\n{pendientes}\n\n¿Cuándo te esperamos para liquidarlo? ¡Gracias!',
    cashback: 'Hola {cliente} ☕ Tienes {cashback} de cashback disponible en {negocio} (tu clave: {clave}).{vence}\n\nÚsalo en tu próxima compra.',
    libre: 'Hola {cliente} ☕ Te escribimos de {negocio}. '
  };
  const NOMBRES = { ticket: 'Ticket de compra', saldo: 'Recordatorio de saldo', cashback: 'Aviso de cashback', libre: 'Mensaje libre / promoción' };
  const AYUDA = { ticket: '{cliente} {negocio} {folio} {fecha} {detalle} {total} {estado} {cashback}', saldo: '{cliente} {negocio} {saldo} {pendientes}', cashback: '{cliente} {negocio} {cashback} {clave} {vence}', libre: '{cliente} {negocio}' };
  const tpl = () => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return Object.assign({}, DEF); } };
  const negocio = () => ((S.config || {}).nombre || '').trim() || 'Café Sierra Escondida';
  const fill = (t, v) => String(t).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)).replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  const nombreCli = n => { const x = up(n); return !x || x === 'PUNTO DE VENTA' ? '' : x.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()); };
  const telDe = n => { const c = (S.clients || []).find(x => up(x.nombre) === up(n)); return c ? String(c.tel || '') : ''; };
  const dig = t => { const d = String(t || '').replace(/\D/g, ''); return d.length === 10 ? '52' + d : d; };
  const corta = ms => new Date(ms).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
  const base = n => ({ cliente: nombreCli(n) || 'amigo(a)', negocio: negocio() });

  function saldoDe(n) {
    const T = tickets().filter(t => up(t.cliente) === up(n)), pend = T.filter(t => t.estado !== 'Pagado');
    const gen = (S.abonos || []).filter(a => up(a.cliente) === up(n) && !a.folio).reduce((s, a) => s + a.monto, 0);
    const bruto = pend.reduce((s, t) => s + t.resta, 0);
    return { saldo: Math.max(0, Math.round((bruto - gen) * 100) / 100), pend };
  }
  function cbInfo(n) {
    if (!window.CB) return { saldo: 0, clave: '', por: 0 };
    const o = CB.todos()[up(n)], e = CB.enr(n);
    return { saldo: o ? o.saldo : 0, clave: e ? e.clave : '', por: o ? o.porVencer || 0 : 0 };
  }

  const armar = {
    ticket(t) {
      const c = cbInfo(t.cliente), pend = t.estado !== 'Pagado';
      return fill(tpl().ticket, Object.assign(base(t.cliente), {
        folio: t.folio, fecha: new Date(t.fecha).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }),
        detalle: t.items.map(x => '• ' + x.cant + '× ' + x.producto + ' — ' + money(x.cant * x.precio)).join('\n') + (t.desc > 0 ? '\nDescuento: −' + money(t.desc) : ''),
        total: money(t.total), estado: pend ? 'Abonado: ' + money(t.abonado) + ' · Por pagar: ' + money(t.resta) : 'Pagado' + (t.metodo && !String(t.metodo).startsWith('Multipagos') ? ' (' + t.metodo + ')' : '') + ' ✅',
        cashback: c.clave && c.saldo > 0.004 ? '💚 Tu cashback (' + c.clave + '): ' + money(c.saldo) + ' disponible' : ''
      }));
    },
    saldo(n) {
      const s = saldoDe(n);
      return fill(tpl().saldo, Object.assign(base(n), { saldo: money(s.saldo), pendientes: s.pend.slice(0, 8).map(t => '• ' + t.folio + ' (' + corta(t.fecha) + '): ' + money(t.resta)).join('\n') }));
    },
    cashback(n) {
      const c = cbInfo(n);
      return fill(tpl().cashback, Object.assign(base(n), { cashback: money(c.saldo), clave: c.clave || '—', vence: c.por > 0.004 ? '\n⚠️ ' + money(c.por) + ' vencen en los próximos 30 días.' : '' }));
    },
    libre(n) { return fill(tpl().libre, base(n)); }
  };

  /* Revisar y enviar */
  function previa(n, texto, volver, telExtra) {
    const tel = telDe(n) || telExtra || '';
    modal(`<div class="tl"><h2>Enviar por WhatsApp</h2><button class="btn sm ghost" id="wx" aria-label="Cerrar">✕</button></div>
      <div class="mu">${nombreCli(n) ? esc(nombreCli(n)) : 'Sin cliente'} · ${tel ? esc(tel) : '<b>sin teléfono</b>'}</div>
      ${tel ? '' : '<label class="fl">Teléfono (10 dígitos)<input id="wt" type="tel" inputmode="tel" placeholder="662 123 4567"></label><div class="mu">Si lo dejas vacío, WhatsApp te deja elegir el contacto.</div>'}
      <label class="fl">Mensaje (puedes editarlo)<textarea id="wm" rows="11" style="width:100%;font:inherit;line-height:1.4">${esc(texto)}</textarea></label>
      <button class="btn primary" id="wok">Abrir WhatsApp</button><button class="btn ghost" id="wno">${volver ? 'Atrás' : 'Cancelar'}</button>`);
    $('#wx').onclick = closeM; $('#wno').onclick = () => (volver ? volver() : closeM());
    $('#wok').onclick = () => {
      const d = dig(tel || ($('#wt') && $('#wt').value)), m = $('#wm').value.trim(); if (!m) return toast('Escribe el mensaje.', true);
      window.open('https://wa.me/' + d + '?text=' + encodeURIComponent(m), '_blank', 'noopener');
      closeM();
    };
  }

  /* Menú por cliente */
  function menu(n) {
    const s = saldoDe(n), c = cbInfo(n);
    modal(`<div class="tl"><h2>WhatsApp</h2><button class="btn sm ghost" id="wx" aria-label="Cerrar">✕</button></div>
      <div class="mu">${esc(nombreCli(n))} · ${telDe(n) ? esc(telDe(n)) : 'sin teléfono'}</div>
      <div class="cact" style="flex-direction:column;align-items:stretch">
        ${s.saldo > 0 ? `<button class="btn primary" data-w="saldo">Recordar saldo · ${money(s.saldo)}</button>` : ''}
        ${c.saldo > 0.004 ? `<button class="btn ${s.saldo > 0 ? '' : 'primary'}" data-w="cashback">Avisar cashback · ${money(c.saldo)}</button>` : ''}
        <button class="btn" data-w="libre">Mensaje libre / promoción</button>
        <button class="btn ghost" data-w="editar">Personalizar mensajes</button></div>`);
    $('#wx').onclick = closeM;
    $('#mbox').onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; const k = b.dataset.w; if (k === 'editar') return editor(() => menu(n)); previa(n, armar[k](n), () => menu(n)); };
  }

  /* Personalizar plantillas */
  function editor(volver) {
    const T = tpl();
    modal(`<div class="tl"><h2>Mensajes de WhatsApp</h2><button class="btn sm ghost" id="wx" aria-label="Cerrar">✕</button></div>
      <p class="mu" style="margin:0">Escribe los mensajes a tu gusto. Las palabras entre llaves se llenan solas con los datos del cliente. Se guardan en este dispositivo.</p>
      ${Object.keys(DEF).map(k => `<label class="fl">${NOMBRES[k]}<textarea data-k="${k}" rows="${k === 'ticket' ? 8 : 4}" style="width:100%;font:inherit;line-height:1.4">${esc(T[k])}</textarea><span class="mu">Variables: ${AYUDA[k]}</span></label>`).join('')}
      <button class="btn primary" id="wg">Guardar</button><button class="btn ghost" id="wr">Restablecer originales</button>`);
    $('#wx').onclick = () => (volver ? volver() : closeM());
    $('#wg').onclick = () => { const o = {}; document.querySelectorAll('#mbox textarea[data-k]').forEach(t => { o[t.dataset.k] = t.value; }); try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} toast('Mensajes guardados'); volver ? volver() : closeM(); };
    $('#wr').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} toast('Mensajes restablecidos'); editor(volver); };
  }

  window.WA = {
    ticket: t => previa(t.cliente, armar.ticket(t)),
    saldo: n => previa(n, armar.saldo(n)),
    cashback: n => previa(n, armar.cashback(n)),
    menu, editor, previa, armar
  };
})();

(() => {

          <div class="card kpi"><span class="mu">Convertidas en venta</span><b>${todas.filter(c => c.estado === 'Convertida').length}</b></div></div>
        <input id="cq" type="search" placeholder="Buscar por folio, cliente o producto" aria-label="Buscar cotización" value="${esc(F.q)}">
        <div class="chips">${FILTROS.map(f => `<button class="chip" data-f="${f}" aria-pressed="${f === F.f}">${f}</button>`).join('')}</div>
        <div class="mu" id="cn"></div><div class="list" id="cl"></div>`;
      $('#cq').oninput = e => { F.q = e.target.value; list(); };
      root.onclick = e => {
        const f = e.target.closest('[data-f]'); if (f) { F.f = f.dataset.f; views.cotizaciones.render(root); return; }
        const b = e.target.closest('[data-a]'); if (!b) return;
        const c = L[+b.dataset.i];
        ({ load: () => Vender.load(c.items, { cli: c.cliente, cot: c.folio, desc: c.descuento, nota: c.notas }), wa: () => wa(c), print: () => Cotizacion.abrir(c), cancel: () => cancel(c) })[b.dataset.a]();
      };

  function list() {
    const q = F.q.nrm(), map = { Vigentes: 'Vigente', Convertidas: 'Convertida', Vencidas: 'Vencida', Canceladas: 'Cancelada' };
    L = [...S.cots].reverse().filter(c => (F.f === 'Todas' || est(c) === map[F.f]) && (c.folio + ' ' + c.cliente + ' ' + c.items.map(x => x.nombre || x.producto).join(' ')).nrm().includes(q));

      const e = est(c), d = Math.ceil((c.vigencia - Date.now()) / D);

/* ===== Pantalla Inventario: existencias, mínimos y entradas ===== */
(() => {
  const F = { f: 'Todos', q: '' };

  views.inventario = {
    render(root) {

      root.innerHTML = `<h2>Inventario</h2>
        <div class="kpis"><div class="card kpi"><span class="mu">Productos con control</span><b>${c.length}</b></div><div class="card kpi"><span class="mu">Con existencia baja</span><b>${bajo}</b></div><div class="card kpi"><span class="mu">Agotados</span><b>${ago}</b></div><div class="card kpi"><span class="mu">Valor del inventario (a costo)</span><b>${money(c.reduce((s, p) => s + Math.max(0, p.stock) * p.costo, 0))}</b></div></div>
        <input id="iq" type="search" placeholder="Buscar producto" aria-label="Buscar producto" value="${esc(F.q)}">
        <div class="chips">${['Todos', 'Bajo', 'Agotado', 'Sin control'].map(f => `<button class="chip" data-f="${f}" aria-pressed="${f === F.f}">${f}</button>`).join('')}</div>
        <div class="list" id="il"></div>`;
      $('#iq').oninput = e => { F.q = e.target.value; list(); };
      root.onclick = e => {
        const f = e.target.closest('[data-f]'); if (f) { F.f = f.dataset.f; views.inventario.render(root); return; }
        const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a, L[+b.dataset.i]);
      };
      list();
    }
  };

  function list() {
    L = S.prods.filter(p => (p.nombre + p.cat).nrm().includes(F.q.nrm()) && (F.f === 'Todos' || st(p) === F.f)).slice(0, 150);
    $('#il').innerHTML = L.map((p, i) => `<div class="card"><div class="tl"><b>${esc(p.nombre)}</b><span class="tag ${st(p) === 'Disponible' ? 'ok' : ''}">${st(p)}</span></div>
      <div class="mu">${esc(p.cat)}${p.stock == null ? '' : ' · Mínimo ' + p.min}</div>
      <div class="tl" style="margin-top:6px"><b class="amt">${p.stock == null ? '—' : p.stock}</b><span>
        <button class="btn sm primary" data-a="entrada" data-i="${i}">Entrada</button>
        <button class="btn sm ghost" data-a="ajuste" data-i="${i}">${p.stock == null ? 'Activar control' : 'Ajustar'}</button>
        ${p.stock == null ? '' : `<button class="btn sm ghost" data-a="min" data-i="${i}">Mínimo</button>`}</span></div></div>`).join('') || '<p class="mu">No hay productos con ese filtro.</p>';
  }

  function act(a, p) {
    const T = { entrada: ['Entrada de mercancía', 'Cantidad que entra', 'Guardar entrada'], ajuste: [p.stock == null ? 'Activar control de existencia' : 'Ajustar existencia', 'Existencia real contada', 'Guardar existencia'], min: ['Existencia mínima', 'Avisar cuando queden…', 'Guardar mínimo'] }[a];
    modal(`<h2>${T[0]}</h2><p class="mu">${esc(p.nombre)}${p.stock == null ? '' : ' · hay ' + p.stock}</p>
      <input id="iv" type="number" min="0" step="any" inputmode="decimal" placeholder="${T[1]}" aria-label="${T[1]}" value="${a === 'min' ? p.min : ''}">
      ${a === 'min' ? '' : '<input id="in" placeholder="Nota (proveedor, motivo…)" aria-label="Nota">'}
      <button class="btn primary" id="iok">${T[2]}</button><button class="btn ghost" id="ino">Cancelar</button>`);
    $('#iv').focus(); $('#ino').onclick = closeM;
    $('#iok').onclick = async () => {
      const v = $('#iv').value;
      if (v === '' || +v < 0 || (a === 'entrada' && !(+v > 0))) return toast('Escribe una cantidad válida.', true);
      if (a === 'min') await api('setMinStock', p.nombre, +v); else await api('adjustStock', p.nombre, a, +v, $('#in').value);
      closeM(); toast('Inventario actualizado'); load();
    };
  }
})();

  function list() {

(() => {

  let day = dkey(Date.now());

    render(root) {

      root.innerHTML = `<h2>Corte</h2>

        <div class="card" style="margin-top:16px"><h2 style="font-size:16px;margin-bottom:10px">Cerrar corte semanal</h2>
          <div class="form"><input type="date" id="cs" value="${dkey(mon.getTime())}" aria-label="Inicio"><input type="date" id="ce" value="${dkey(now.getTime())}" aria-label="Fin"><input id="co" placeholder="Observaciones" aria-label="Observaciones"></div>
          <button class="btn primary" id="cg" style="margin-top:10px">Guardar corte semanal</button></div>`;
      $('#cd').onchange = e => { day = e.target.value; summary(); };
      $('#cg').onclick = cerrar;

  function summary() {
    const all = tickets(), T = all.filter(t => dkey(t.fecha) === day), P = T.filter(t => t.estado === 'Pagado');
    const met = {}, prod = {};
    P.forEach(t => { const m = String(t.metodo).startsWith('Multipagos') ? 'Multipagos' : t.metodo; met[m] = (met[m] || 0) + t.total; });
    T.forEach(t => t.items.forEach(x => prod[x.producto] = (prod[x.producto] || 0) + x.cant));
    const cobrado = P.reduce((s, t) => s + t.total, 0);
    const util = P.reduce((s, t) => s + t.items.reduce((a, x) => a + x.total - x.cant * x.costo, 0), 0);
    const pend = all.filter(t => t.estado !== 'Pagado').reduce((s, t) => s + t.resta, 0);
    const top = Object.entries(prod).sort((a, b) => b[1] - a[1]).slice(0, 6);
    $('#cr').innerHTML = `<div class="kpis">
      <div class="card kpi"><span class="mu">Cobrado del día</span><b>${money(cobrado)}</b></div>

      <div class="card"><b>Más vendidos del día</b>${top.map(([k, v]) => `<div class="tl"><span>${esc(k)}</span><b>${v}</b></div>`).join('') || '<p class="mu">No hay ventas este día.</p>'}</div></div>`;
  }
